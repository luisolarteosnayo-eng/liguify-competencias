<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Guía de inicio · Modo Club — Liguify</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script>tailwind.config={theme:{extend:{colors:{brand:{50:'#fdf2f2',100:'#fbe3e4',500:'#d9232e',600:'#c11e28'},ink:{400:'#8b93a7',500:'#5b6478',700:'#2b3550',900:'#171e2e'},paper:'#faf9f7',line:'#e9e6e0'},fontFamily:{display:['"Bebas Neue"','sans-serif'],sans:['Inter','sans-serif']}}}}</script>
<style>
  body{font-family:Inter,sans-serif}
  .font-display{font-family:"Bebas Neue",sans-serif}
  /* resaltado pulsante del control que se explica */
  .hl{position:relative}
  .hl::after{content:'';position:absolute;inset:-6px;border:3px solid #d9232e;border-radius:14px;animation:pulso 1.4s infinite}
  @keyframes pulso{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.04)}}
  .slide{animation:entra .45s ease}
  @keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  #barra{transition:width .2s linear}
</style>
</head>
<body class="bg-ink-900 min-h-screen flex flex-col">

<header class="text-white">
  <div class="max-w-3xl mx-auto px-4 py-4 flex items-center gap-3">
    <span class="w-9 h-9 rounded-xl bg-brand-500 grid place-items-center font-display text-xl">L</span>
    <div class="flex-1"><p class="font-display text-2xl tracking-wide leading-none">GUÍA DE INICIO</p>
      <p class="text-[10px] uppercase tracking-widest text-white/50 font-bold">Modo Club · Liguify Competencias</p></div>
    <a href="club.html" class="bg-white/10 border border-white/20 text-xs font-bold px-4 py-2 rounded-xl hover:bg-white/20">IR A MI CLUB →</a>
  </div>
</header>

<main class="flex-1 flex flex-col max-w-3xl w-full mx-auto px-4 pb-6">
  <!-- barra de progreso de la diapositiva (modo auto) -->
  <div class="h-1 bg-white/10 rounded-full overflow-hidden mb-3"><div id="barra" class="h-full bg-brand-500" style="width:0%"></div></div>

  <div class="bg-paper rounded-2xl flex-1 flex flex-col overflow-hidden">
    <div class="px-5 pt-4 flex items-center justify-between gap-2">
      <span id="capitulo" class="text-[10px] font-bold uppercase tracking-widest text-brand-600"></span>
      <span id="contador" class="text-[10px] font-bold text-ink-400"></span>
    </div>
    <div id="stage" class="flex-1 px-5 py-4 overflow-y-auto"></div>
  </div>

  <!-- controles tipo reproductor -->
  <div class="flex items-center justify-center gap-2 mt-4">
    <button onclick="ir(0)" class="text-white/60 hover:text-white text-lg px-2" title="Inicio">⏮</button>
    <button onclick="ant()" class="bg-white/10 border border-white/20 text-white font-bold px-5 py-2.5 rounded-xl hover:bg-white/20">◀ ANTERIOR</button>
    <button id="btn-auto" onclick="toggleAuto()" class="bg-brand-500 text-white font-bold px-5 py-2.5 rounded-xl hover:bg-brand-600">⏸ PAUSA</button>
    <button onclick="sig()" class="bg-white/10 border border-white/20 text-white font-bold px-5 py-2.5 rounded-xl hover:bg-white/20">SIGUIENTE ▶</button>
  </div>
  <div id="puntos" class="flex items-center justify-center gap-1.5 mt-3 flex-wrap"></div>
</main>

<script>
const $=id=>document.getElementById(id);
/* Maquetas reutilizables (recreaciones simplificadas de la app real) */
const chip=(t,c)=>`<span class="text-[10px] font-bold px-2 py-1 rounded-full ${c}">${t}</span>`;
const btn=(t,c,hl)=>`<span class="${hl?'hl ':''}inline-block ${c} text-xs font-bold px-4 py-2.5 rounded-xl">${t}</span>`;
const card=h=>`<div class="bg-white border border-line rounded-2xl p-5 shadow-sm">${h}</div>`;

const SLIDES=[
// ── CAP 1 · ENTRAR AL MODO CLUB ─────────────────────────────
{cap:'Capítulo 1 · Entrar al modo Club', html:`
  <div class="text-center py-8">
    <p class="text-6xl mb-4">🛡️</p>
    <h2 class="font-display text-5xl tracking-wide mb-3">BIENVENIDO AL MODO CLUB</h2>
    <p class="text-ink-500 text-sm max-w-md mx-auto">En 6 capítulos aprenderás a entrar al sistema, nombrar sub-coordinadores, manejar tu contraseña, registrar jugadores, subir autorizaciones, y cargar y ver los resultados y estadísticas de tus partidos. Puedes dejar que avance solo (como un video) o navegar con los botones.</p>
  </div>`},
{cap:'Capítulo 1 · Entrar al modo Club', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">1. ENTRA DESDE LIGUIFY.COM</h3>
  ${card(`<div class="flex items-center gap-3 flex-wrap">
    <span class="w-10 h-10 rounded-xl bg-brand-500 grid place-items-center font-display text-white text-lg">L</span>
    <span class="font-bold flex-1">liguify.com</span>
    ${btn('🛡️ Mi Club','bg-ink-900 text-white',true)}
    ${btn('Academias','bg-white border border-line text-ink-500')}
    ${btn('Financiero','bg-white border border-line text-ink-500')}
  </div>`)}
  <p class="text-sm text-ink-500 mt-4">En la página principal de <b>liguify.com</b>, pulsa el botón <b>🛡️ Mi Club</b> (arriba a la derecha). También puedes entrar directo en <b>liguify.com/club</b>.</p>`},
{cap:'Capítulo 1 · Entrar al modo Club', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">2. DOS FORMAS DE OBTENER ACCESO</h3>
  <div class="grid sm:grid-cols-2 gap-3">
    ${card(`<p class="text-2xl mb-1">📨</p><p class="font-bold text-sm mb-1">Invitación por email (coordinador)</p>
      <p class="text-xs text-ink-500">Tu organizador te registra con tu correo y te llega un <b>enlace de acceso</b>. Ábrelo y acepta la invitación.</p>`)}
    ${card(`<p class="text-2xl mb-1">🎟</p><p class="font-bold text-sm mb-1">Código de equipo (delegado)</p>
      <p class="text-xs text-ink-500">Tu organizador te da un <b>código de un solo uso</b> (ej. 7KQ2XM). Crea tu cuenta y canjéalo.</p>`)}
  </div>
  <p class="text-sm text-ink-500 mt-4">⚠ Importante: la invitación llega <b>al correo exacto</b> que registró tu organizador — entra con ese mismo correo.</p>`},
{cap:'Capítulo 1 · Entrar al modo Club', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">3. SI TE INVITARON: ACEPTA LA INVITACIÓN</h3>
  ${card(`<div class="bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-4 flex items-center gap-3 flex-wrap">
    <span class="text-2xl">📨</span>
    <span class="flex-1 min-w-40 text-sm"><b>TU TORNEO</b> te invita como <b>COORDINADOR del club TU CLUB</b></span>
    ${btn('✔ ACEPTAR INVITACIÓN','bg-emerald-600 text-white',true)}
  </div>`)}
  <p class="text-sm text-ink-500 mt-4">Al entrar con el enlace del correo verás esta tarjeta verde: pulsa <b>ACEPTAR INVITACIÓN</b> y tendrás acceso a todos los equipos de tu club en ese torneo.</p>`},
{cap:'Capítulo 1 · Entrar al modo Club', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">4. SI TIENES CÓDIGO: CANJÉALO</h3>
  ${card(`<p class="text-xs text-ink-400 font-bold uppercase mb-2">¿Tienes un código de equipo?</p>
    <div class="flex gap-2">
      <span class="flex-1 border-2 border-line rounded-xl px-3 py-2 text-sm font-bold text-ink-400">EJ: 7KQ2XM</span>
      ${btn('CANJEAR','bg-ink-900 text-white',true)}
    </div>`)}
  <p class="text-sm text-ink-500 mt-4">Primero crea tu cuenta (o entra con Google), escribe el código en el recuadro del inicio y pulsa <b>CANJEAR</b>. El código es de <b>un solo uso</b>: al canjearlo queda anulado y tu equipo vinculado a tu cuenta.</p>`},

// ── CAP 2 · SUB-COORDINADORES POR CATEGORÍA ─────────────────
{cap:'Capítulo 2 · Sub-coordinadores por categoría', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">5. NOMBRA SUB-COORDINADORES (SI ERES COORDINADOR)</h3>
  ${card(`<div class="bg-ink-900 rounded-2xl px-4 py-3 flex items-center gap-3 flex-wrap">
    <span class="font-display text-xl tracking-wide text-white">TU TORNEO</span>
    <span class="text-xs text-white/50">TU MARCA</span>
    ${btn('➕ SUB-COORDINADOR','bg-white/10 border border-white/30 text-white',true)}
  </div>`)}
  <p class="text-sm text-ink-500 mt-4">Como <b>coordinador</b> ves TODO tu club, pero puedes delegar: en <b>Mis equipos</b>, en la cabecera de cada torneo está el botón <b>➕ SUB-COORDINADOR</b>. El sub-coordinador es un encargado que solo gestiona <b>las categorías que tú le asignes</b> (por ejemplo, el profe de la 2015).</p>`},
{cap:'Capítulo 2 · Sub-coordinadores por categoría', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">6. ELIGE SUS CATEGORÍAS E INVÍTALO</h3>
  ${card(`<div class="grid sm:grid-cols-2 gap-3 mb-3">
    <div><p class="text-[10px] font-bold text-ink-400 uppercase mb-1">Nombre / Teléfono / Email</p>
      <p class="border-b border-line pb-1 text-sm font-bold">Profe Carlos · 999 111 222</p>
      <p class="border-b border-line pb-1 text-sm font-bold mt-1.5">profe.carlos@gmail.com</p></div>
    <div><p class="text-[10px] font-bold text-ink-400 uppercase mb-1">Categorías a su cargo</p>
      <p class="text-sm font-bold">☑ Categoría 2015 / F9</p>
      <p class="text-sm font-bold">☑ Categoría 2016 / F9</p>
      <p class="text-sm text-ink-400">☐ Categoría 2019 / F7</p></div>
  </div>
  ${btn('📨 INVITAR SUB-COORDINADOR','bg-brand-500 text-white',true)}`)}
  <p class="text-sm text-ink-500 mt-4">Registra su <b>nombre, teléfono y email</b>, marca <b>sus categorías</b> y pulsa INVITAR. Le llegará un correo con su acceso (mismo proceso que el tuyo: acepta la invitación y crea su contraseña). 💡 Si coordinas <b>más de un club</b> en el torneo, primero eliges el club. Podrá cargar y editar la LBF solo de sus categorías; puedes revocarlo cuando quieras con la ✕.</p>`},

// ── CAP 3 · TU CONTRASEÑA ───────────────────────────────────
{cap:'Capítulo 3 · Tu contraseña', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">7. CREA O CAMBIA TU CONTRASEÑA</h3>
  ${card(`<div class="bg-ink-900 rounded-xl p-3 flex items-center gap-3">
    <span class="font-display text-white text-lg tracking-wide flex-1">LIGUIFY <span class="text-white/40">CLUB</span></span>
    <span class="text-white/70 text-xs">tucorreo@gmail.com</span>
    ${btn('🔑','bg-white/10 border border-white/30 text-white',true)}
    ${btn('SALIR','bg-white border border-line text-ink-900')}
  </div>`)}
  <p class="text-sm text-ink-500 mt-4">Si entraste por el enlace del correo, aún no tienes contraseña: pulsa el botón <b>🔑</b> (arriba a la derecha) para crearla. Con ella podrás entrar directo la próxima vez, sin esperar correos.</p>`},
{cap:'Capítulo 3 · Tu contraseña', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">8. ¿LA OLVIDASTE? RECUPÉRALA</h3>
  ${card(`<p class="font-display text-2xl tracking-wide mb-2">MI CLUB</p>
    <p class="text-xs text-ink-400 mb-1">Email</p>
    <p class="border-b border-line pb-1 text-sm font-bold mb-3">tucorreo@gmail.com</p>
    <div class="flex gap-2 mb-3">${btn('ENTRAR','bg-brand-500 text-white')}${btn('Entrar con Google','bg-white border border-line text-ink-700')}</div>
    <span class="hl inline-block text-xs text-ink-400 underline">¿Olvidaste tu contraseña?</span>`)}
  <p class="text-sm text-ink-500 mt-4">En la pantalla de entrada: <b>escribe tu email</b> y pulsa <b>"¿Olvidaste tu contraseña?"</b> — te llegará un correo con el enlace para crear una nueva. 💡 Si tu correo es Gmail, también puedes pulsar <b>Entrar con Google</b> y listo, sin contraseña.</p>`},

// ── CAP 3 · REGISTRAR JUGADORES ─────────────────────────────
{cap:'Capítulo 4 · Registrar jugadores', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">9. ENTRA A TU EQUIPO → PLANTEL</h3>
  ${card(`<div class="flex items-center justify-between flex-wrap gap-2">
    <p class="font-display text-xl tracking-wide">PLANTEL · LISTA DE BUENA FE <span class="text-xs font-sans text-ink-400 font-semibold">12/30</span></p>
    ${btn('+ AGREGAR JUGADOR/A','bg-ink-900 text-white',true)}
  </div>`)}
  <p class="text-sm text-ink-500 mt-4">En <b>Mis equipos</b> toca tu equipo y entra a la pestaña <b>Plantel (LBF)</b>. Pulsa <b>+ AGREGAR JUGADOR/A</b>. El contador muestra cuántos cupos tienes según las reglas del torneo.</p>`},
{cap:'Capítulo 4 · Registrar jugadores', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">10. BUSCA POR DOCUMENTO</h3>
  ${card(`<div class="flex gap-2">
    <span class="border border-line rounded-xl px-3 py-2 text-sm font-bold">PE</span>
    <span class="hl flex-1 border-2 border-line rounded-xl px-3 py-2 text-sm font-bold text-ink-400">N° de documento</span>
    ${btn('BUSCAR','bg-ink-900 text-white')}
  </div>`)}
  <p class="text-sm text-ink-500 mt-4">Escribe el <b>DNI del jugador</b>. Si ya existe en Liguify (jugó otro torneo), se inscribe <b>sin re-digitar sus datos</b>. Si es nuevo, completas nombres, apellidos y fecha de nacimiento. 🔒 Un jugador solo puede estar en un equipo por categoría (anti-suplantación).</p>`},
{cap:'Capítulo 4 · Registrar jugadores', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">11. SUBE SU FOTO Y COMPLETA LA FICHA</h3>
  ${card(`<div class="flex items-center gap-3">
    <span class="w-14 h-14 rounded-2xl bg-ink-700 grid place-items-center text-white font-bold">FT</span>
    <div class="flex gap-2">${btn('📷 Cámara','bg-ink-900 text-white',true)}${btn('🖼 Galería','bg-white border border-line text-ink-500')}</div>
  </div>
  <p class="text-[11px] text-ink-400 mt-3">También: fotos del DNI (frontal y reverso — van a almacenamiento privado), dorsal, posición y pie hábil.</p>`)}
  <p class="text-sm text-ink-500 mt-4">Desde el celular puedes <b>tomar la foto con la cámara</b> o elegirla de la galería. Las fotos se optimizan solas. La del jugador aparece en el módulo público; las del DNI son privadas (solo staff y tu club).</p>`},
{cap:'Capítulo 4 · Registrar jugadores', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">12. EL ESTADO DE TUS JUGADORES</h3>
  ${card(`<div class="flex items-center gap-3 border-b border-line pb-2 mb-2">
    <span class="w-8 h-8 rounded-full bg-ink-700 grid place-items-center text-[10px] font-bold text-white">JP</span>
    <span class="flex-1 text-sm font-bold">Juan Pérez</span>${chip('PENDIENTE','bg-amber-100 text-amber-700')}
  </div>
  <div class="flex items-center gap-3">
    <span class="w-8 h-8 rounded-full bg-ink-700 grid place-items-center text-[10px] font-bold text-white">MR</span>
    <span class="flex-1 text-sm font-bold">Mario Ruiz</span>${chip('ACTIVO','bg-emerald-100 text-emerald-700')}
  </div>`)}
  <p class="text-sm text-ink-500 mt-4">Si tu torneo <b>exige autorización de padre/tutor</b>, el jugador queda <b>PENDIENTE</b> hasta subirla (siguiente capítulo). Si el torneo no la exige, queda <b>habilitado automáticamente</b>.</p>`},

// ── CAP 4 · AUTORIZACIÓN PDF ───────────────────────────────
{cap:'Capítulo 5 · Autorización de Padre/Tutor', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">13. ABRE LA FICHA DEL JUGADOR (✏️)</h3>
  ${card(`<div class="flex items-center gap-3">
    <span class="w-8 h-8 rounded-full bg-ink-700 grid place-items-center text-[10px] font-bold text-white">JP</span>
    <span class="flex-1 text-sm font-bold">Juan Pérez</span>
    ${chip('📄 AUT. PENDIENTE','bg-amber-100 text-amber-700')}${chip('PENDIENTE','bg-amber-100 text-amber-700')}
    ${btn('✏️','bg-white border border-line text-ink-500',true)}
  </div>`)}
  <p class="text-sm text-ink-500 mt-4">Los jugadores a los que les falta la autorización llevan el aviso <b>📄 AUT. PENDIENTE</b>. Pulsa el lápiz <b>✏️</b> para abrir su ficha.</p>`},
{cap:'Capítulo 5 · Autorización de Padre/Tutor', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">14. SUBE EL PDF (O UNA FOTO)</h3>
  ${card(`<p class="text-[10px] font-bold text-ink-400 uppercase tracking-wider mb-2">Autorización de Padre/Tutor (única por jugador — vale para todos los torneos)</p>
    <div class="flex items-center gap-2 flex-wrap">
      ${btn('📁 SUBIR PDF','bg-white border border-line text-ink-500',true)}
      ${btn('📷','bg-ink-900 text-white')}
      <span class="text-[10px] font-bold text-amber-600">— pendiente de subir</span>
    </div>`)}
  <p class="text-sm text-ink-500 mt-4">En la ficha verás la sección <b>Autorización de Padre/Tutor</b>: sube el <b>PDF firmado</b> (o una foto del documento con la cámara). Se guarda en almacenamiento <b>privado</b> y es <b>único por jugador</b>: vale para todos sus torneos.</p>`},
{cap:'Capítulo 5 · Autorización de Padre/Tutor', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">15. ¡Y LISTO! ACTIVO AUTOMÁTICAMENTE</h3>
  ${card(`<div class="flex items-center gap-3">
    <span class="w-8 h-8 rounded-full bg-emerald-600 grid place-items-center text-[10px] font-bold text-white">JP</span>
    <span class="flex-1 text-sm font-bold">Juan Pérez</span>
    ${chip('✔ AUTORIZACIÓN','bg-emerald-100 text-emerald-700')}${chip('ACTIVO','bg-emerald-100 text-emerald-700')}
  </div>`)}
  <p class="text-sm text-ink-500 mt-4">Al subir la autorización, el jugador pasa a <b>ACTIVO</b> al instante y su foto sale <b>a color</b> en la página pública del torneo (la autorización incluye el consentimiento de imagen). Sin pasos extra.</p>`},

// ── CAP 6 · RESULTADOS Y ESTADÍSTICAS ───────────────────────
{cap:'Capítulo 6 · Resultados y estadísticas', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">16. VE TUS PARTIDOS Y RESULTADOS</h3>
  ${card(`<div class="flex gap-2 mb-3">${btn('Plantel (LBF)','bg-white border border-line text-ink-500')}${btn('Partidos','bg-ink-900 text-white',true)}${btn('Tabla','bg-white border border-line text-ink-500')}</div>
  <div class="hl border border-line rounded-xl px-4 py-3">
    <div class="flex items-center text-sm">
      <span class="flex-1 text-right font-bold">TU EQUIPO 🛡️</span>
      <span class="w-24 text-center"><span class="block text-[9px] font-bold text-emerald-600 uppercase">finalizado</span><span class="font-display text-2xl">3 : 1</span></span>
      <span class="flex-1 font-bold">🛡️ RIVAL FC</span>
    </div>
    <p class="text-[10px] text-ink-400 text-center mt-1">Fecha 2 · 2026-08-16 10:00 · Cancha 1</p>
  </div>`)}
  <p class="text-sm text-ink-500 mt-4">En la pestaña <b>Partidos</b> de tu equipo ves los próximos cruces y los resultados. <b>Toca cualquier partido</b> para abrir su detalle: marcador, tu plantel con goles ⚽ y tarjetas 🟨🟥, y la ⭐ figura del partido.</p>`},
{cap:'Capítulo 6 · Resultados y estadísticas', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">17. CARGA LOS MINUTOS Y ASISTENCIAS</h3>
  ${card(`<div class="flex items-center justify-between border-b-2 border-ink-900 pb-1 mb-2">
    <p class="font-display text-lg tracking-wide">TU EQUIPO — MI PLANTEL</p>
    <span class="flex gap-1.5 text-[10px] font-bold text-ink-400"><span class="w-12 text-center">⏱ MIN</span><span class="w-12 text-center">🅰 AST</span></span>
  </div>
  <div class="flex items-center gap-1.5 py-1.5 border-b border-line text-sm">
    <span class="w-5 text-ink-400 font-bold text-xs text-right">9</span>
    <span class="flex-1 font-semibold">Juan Pérez <span class="text-xs">⚽⚽</span></span>
    <span class="hl w-12 border border-sky-200 bg-sky-50 rounded-lg text-center py-1 text-xs font-bold">40</span>
    <span class="w-12 border border-emerald-200 bg-emerald-50 rounded-lg text-center py-1 text-xs font-bold">1</span>
  </div>
  <div class="mt-2">${btn('GUARDAR ESTADÍSTICAS','bg-brand-500 text-white',true)}</div>`)}
  <p class="text-sm text-ink-500 mt-4">Dentro del detalle de un partido jugado, <b>tu club registra los minutos y las asistencias</b> de cada jugador directamente en las casillas y pulsa <b>GUARDAR</b>. Los ⚽ goles y las 🟨🟥 tarjetas son oficiales: los carga el organizador. Los minutos &gt; 0 cuentan como partido jugado (PJ).</p>`},
{cap:'Capítulo 6 · Resultados y estadísticas', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">18. LAS ESTADÍSTICAS DE TUS JUGADORES</h3>
  ${card(`<p class="font-display text-lg tracking-wide mb-2">📊 ESTADÍSTICAS DEL TORNEO <span class="text-xs font-sans text-ink-400 font-semibold">partido de 50'</span></p>
  <div class="hl overflow-x-auto"><table class="w-full text-xs whitespace-nowrap">

];

let IDX=0, AUTO=true, TIMER=null, T0=0;
const DUR=9000;   // 9s por diapositiva en modo auto
function render(){
  const s=SLIDES[IDX];
  $('stage').innerHTML=`<div class="slide">${s.html}</div>`;
  $('capitulo').textContent=s.cap;
  $('contador').textContent=`${IDX+1} / ${SLIDES.length}`;
  $('puntos').innerHTML=SLIDES.map((x,i)=>`<button onclick="ir(${i})" class="w-2.5 h-2.5 rounded-full ${i===IDX?'bg-brand-500':'bg-white/25 hover:bg-white/50'}"></button>`).join('');
  reiniciarBarra();
}
function reiniciarBarra(){ T0=Date.now(); $('barra').style.width='0%'; }
function tick(){
  if(!AUTO) return;
  const p=Math.min(100,(Date.now()-T0)/DUR*100);
  $('barra').style.width=p+'%';
  if(p>=100){ IDX=(IDX+1)%SLIDES.length; render(); }
}
function ir(i){ IDX=i; render(); }
function sig(){ IDX=Math.min(SLIDES.length-1,IDX+1); render(); }
function ant(){ IDX=Math.max(0,IDX-1); render(); }
function toggleAuto(){
  AUTO=!AUTO;
  $('btn-auto').textContent=AUTO?'⏸ PAUSA':'▶ AUTO';
  if(AUTO) reiniciarBarra(); else $('barra').style.width='0%';
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')sig();
  if(e.key==='ArrowLeft')ant();
  if(e.key===' '){e.preventDefault();toggleAuto();}
});
render();
TIMER=setInterval(tick,150);
</script>
