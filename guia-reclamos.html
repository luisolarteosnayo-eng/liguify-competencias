<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Guía de Reclamos · Modo Club — Liguify</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script>tailwind.config={theme:{extend:{colors:{brand:{50:'#fdf2f2',100:'#fbe3e4',500:'#d9232e',600:'#c11e28'},ink:{400:'#8b93a7',500:'#5b6478',700:'#2b3550',900:'#171e2e'},paper:'#faf9f7',line:'#e9e6e0'},fontFamily:{display:['"Bebas Neue"','sans-serif'],sans:['Inter','sans-serif']}}}}</script>
<style>
  body{font-family:Inter,sans-serif}
  .font-display{font-family:"Bebas Neue",sans-serif}
  .hl{position:relative}
  .hl::after{content:'';position:absolute;inset:-6px;border:3px solid #d9232e;border-radius:14px;animation:pulso 1.4s infinite}
  @keyframes pulso{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.04)}}
  .slide{animation:entra .45s ease}
  @keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  #barra{transition:width .2s linear}
</style>
</head>
<body class="bg-ink-900 min-h-screen flex flex-col">

<header class="text-white">
  <div class="max-w-3xl mx-auto px-4 py-4 flex items-center gap-3">
    <span class="w-9 h-9 rounded-xl bg-brand-500 grid place-items-center font-display text-xl">L</span>
    <div class="flex-1"><p class="font-display text-2xl tracking-wide leading-none">GUÍA DE RECLAMOS</p>
      <p class="text-[10px] uppercase tracking-widest text-white/50 font-bold">Modo Club · Liguify</p></div>
    <a href="/club" class="bg-white/10 border border-white/20 text-xs font-bold px-4 py-2 rounded-xl hover:bg-white/20">IR A MI CLUB →</a>
  </div>
</header>

<main class="flex-1 flex flex-col max-w-3xl w-full mx-auto px-4 pb-6">
  <div class="h-1 bg-white/10 rounded-full overflow-hidden mb-3"><div id="barra" class="h-full bg-brand-500" style="width:0%"></div></div>

  <div class="bg-paper rounded-2xl flex-1 flex flex-col overflow-hidden">
    <div class="px-5 pt-4 flex items-center justify-between gap-2">
      <span id="capitulo" class="text-[10px] font-bold uppercase tracking-widest text-brand-600"></span>
      <span id="contador" class="text-[10px] font-bold text-ink-400"></span>
    </div>
    <div id="stage" class="flex-1 px-5 py-4 overflow-y-auto"></div>
  </div>

  <div class="flex items-center justify-center gap-2 mt-4">
    <button onclick="ir(0)" class="text-white/60 hover:text-white text-lg px-2" title="Inicio">⏮</button>
    <button onclick="ant()" class="bg-white/10 border border-white/20 text-white font-bold px-5 py-2.5 rounded-xl hover:bg-white/20">◀ ANTERIOR</button>
    <button id="btn-auto" onclick="toggleAuto()" class="bg-brand-500 text-white font-bold px-5 py-2.5 rounded-xl hover:bg-brand-600">⏸ PAUSA</button>
    <button onclick="sig()" class="bg-white/10 border border-white/20 text-white font-bold px-5 py-2.5 rounded-xl hover:bg-white/20">SIGUIENTE ▶</button>
  </div>
  <div id="puntos" class="flex items-center justify-center gap-1.5 mt-3 flex-wrap"></div>
  <p class="text-center text-[10px] text-white/40 mt-3">¿Nuevo en el Modo Club? Mira primero la <a href="/guia" class="underline hover:text-white/70">guía del Modo Club</a>.</p>
</main>

<script>
const $=id=>document.getElementById(id);
const chip=(t,c)=>`<span class="text-[10px] font-bold px-2 py-1 rounded-full ${c}">${t}</span>`;
const btn=(t,c,hl)=>`<span class="${hl?'hl ':''}inline-block ${c} text-xs font-bold px-4 py-2.5 rounded-xl">${t}</span>`;
const card=h=>`<div class="bg-white border border-line rounded-2xl p-5 shadow-sm">${h}</div>`;

const SLIDES=[
// ── PORTADA ──────────────────────────────────────────────────
{cap:'Guía de reclamos', html:`
  <div class="text-center py-8">
    <p class="text-6xl mb-4">⚖</p>
    <h2 class="font-display text-5xl tracking-wide mb-3">¿CÓMO PRESENTAR UN RECLAMO?</h2>
    <p class="text-ink-500 text-sm max-w-md mx-auto">Si tu club detecta una irregularidad en un partido (jugador no habilitado, suplantación, error de mesa…), puedes presentar un <b>reclamo formal</b> desde el Modo Club. El organizador lo revisa, el otro club presenta su descargo y la resolución llega por email. Esta guía avanza sola — o navega con los botones.</p>
  </div>`},

// ── CAP 1 · ANTES DE RECLAMAR ───────────────────────────────
{cap:'Capítulo 1 · Antes de reclamar', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">1. ¿QUIÉN, CUÁNDO Y SOBRE QUÉ?</h3>
  <div class="grid sm:grid-cols-3 gap-3">
    ${card(`<p class="text-2xl mb-1">👤</p><p class="text-xs text-ink-500"><b>Quién:</b> solo el <b>coordinador del club</b> (o sub-coordinador de la categoría) desde el Modo Club.</p>`)}
    ${card(`<p class="text-2xl mb-1">🕒</p><p class="text-xs text-ink-500"><b>Cuándo:</b> dentro del <b>plazo del torneo</b> (revisa las indicaciones que aparecen al abrir el reclamo).</p>`)}
    ${card(`<p class="text-2xl mb-1">⚽</p><p class="text-xs text-ink-500"><b>Sobre qué:</b> partidos de la <b>última fecha jugada</b> donde participó tu equipo.</p>`)}
  </div>`},
{cap:'Capítulo 1 · Antes de reclamar', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">2. TEN LISTO ANTES DE EMPEZAR</h3>
  ${card(`<ul class="text-sm text-ink-500 space-y-2">
    <li>📝 Los <b>hechos claros</b>: qué pasó, quién, en qué minuto, y qué solicitas.</li>
    <li>📷 Hasta <b>3 fotos</b> como evidencia (planillas, jugadores, pantallas).</li>
    <li>🎬 <b>1 video</b> (opcional) que respalde el reclamo.</li>
    <li>🧾 La <b>imagen del pago de la tasa</b> del reclamo — el monto y el número de Yape/cuenta aparecen en el propio formulario.</li>
  </ul>`)}
  <p class="text-sm text-ink-500 mt-4">💡 Si el reclamo es declarado <b>VÁLIDO</b>, la tasa se te <b>devuelve</b>. Si es <b>RECHAZADO</b>, el monto queda a disposición de la organización, según las condiciones del torneo.</p>`},

// ── CAP 2 · CREAR EL RECLAMO ────────────────────────────────
{cap:'Capítulo 2 · Crea el reclamo', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">3. ENTRA A ⚖ RECLAMOS</h3>
  ${card(`<div class="bg-ink-900 rounded-2xl px-4 py-3 flex items-center gap-3 flex-wrap">
    <span class="w-9 h-9 rounded-xl bg-white grid place-items-center font-display text-ink-900">T</span>
    <span class="font-display text-xl text-white tracking-wide">TU TORNEO</span>
    <span class="ml-auto flex gap-2">${btn('🖨 PROGRAMACIÓN','bg-white/10 border border-white/20 text-white')}${btn('⚖ RECLAMOS','bg-white/10 border border-white/20 text-white',true)}</span>
  </div>`)}
  <p class="text-sm text-ink-500 mt-4">En <b>liguify.com/club</b>, en la banda oscura de tu torneo, toca <b>⚖ RECLAMOS</b>. Ahí verás los reclamos de tu club y el botón para crear uno nuevo.</p>`},
{cap:'Capítulo 2 · Crea el reclamo', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">4. ELIGE EL PARTIDO</h3>
  ${card(`<p class="text-[10px] font-bold text-ink-400 uppercase tracking-widest mb-2">Partidos reclamables · última fecha jugada</p>
  <div class="border border-line rounded-xl px-3 py-2 mb-2 flex items-center gap-2 text-sm"><b>TU EQUIPO</b> <span class="text-ink-400">2 - 3</span> <b>RIVAL FC</b> <span class="ml-auto text-[10px] text-ink-400">Fecha 5 · Cancha 2</span></div>
  <div class="mt-2">${btn('RECLAMAR ESTE PARTIDO','bg-brand-500 text-white',true)}</div>`)}
  <p class="text-sm text-ink-500 mt-4">Solo aparecen los partidos de la <b>última fecha jugada</b> en los que participó tu equipo. Elige el partido y se abre el formulario.</p>`},
{cap:'Capítulo 2 · Crea el reclamo', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">5. ESCRIBE EL CUERPO DEL RECLAMO</h3>
  ${card(`<p class="text-xs text-ink-400 mb-1">Lee primero las <b>indicaciones del torneo</b> (aparecen arriba del formulario). Luego describe:</p>
  <ul class="text-sm text-ink-500 space-y-1.5 mt-2">
    <li>• <b>Qué pasó</b> y en qué momento del partido.</li>
    <li>• <b>Quiénes</b> están involucrados (dorsal y nombre si lo tienes).</li>
    <li>• <b>Qué solicitas</b> (revisión del resultado, verificación de identidad, etc.).</li>
  </ul>`)}
  <p class="text-sm text-ink-500 mt-4">Sé <b>objetivo y respetuoso</b>: el reclamo lo leerán el organizador y el otro club.</p>`},
{cap:'Capítulo 2 · Crea el reclamo', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">6. SUBE LAS EVIDENCIAS Y EL PAGO</h3>
  <div class="grid sm:grid-cols-3 gap-3">
    ${card(`<p class="text-2xl mb-1">📷</p><p class="text-xs text-ink-500"><b>Hasta 3 fotos</b> de respaldo.</p>`)}
    ${card(`<p class="text-2xl mb-1">🎬</p><p class="text-xs text-ink-500"><b>1 video</b> (opcional).</p>`)}
    ${card(`<p class="text-2xl mb-1">🧾</p><p class="text-xs text-ink-500"><b>Imagen del pago</b> de la tasa (obligatoria para enviar).</p>`)}
  </div>
  <p class="text-sm text-ink-500 mt-4">Los archivos quedan en un <b>repositorio privado</b>: solo los ven el organizador y los clubes involucrados.</p>`},
{cap:'Capítulo 2 · Crea el reclamo', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">7. GUARDAR ≠ ENVIAR</h3>
  <div class="grid sm:grid-cols-2 gap-3">
    ${card(`${btn('💾 GUARDAR','bg-ink-900 text-white')}<p class="text-xs text-ink-500 mt-2">Queda como <b>BORRADOR</b>: puedes reabrirlo, corregirlo y completar evidencias con calma. Nadie más lo ve.</p>`)}
    ${card(`${btn('📨 ENVIAR','bg-brand-500 text-white',true)}<p class="text-xs text-ink-500 mt-2">El reclamo se <b>formaliza</b>: recibe su código correlativo (p. ej. <b>RECLAMO 2026 0003</b>), ya <b>no se puede editar</b>, y avisa por email al organizador y a ambos clubes.</p>`)}
  </div>`},

// ── CAP 3 · SEGUIMIENTO ─────────────────────────────────────
{cap:'Capítulo 3 · Seguimiento', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">8. LOS ESTADOS DEL RECLAMO</h3>
  ${card(`<div class="flex flex-wrap items-center gap-2 mb-3">
    ${chip('GENERADO','bg-sky-100 text-sky-700')} <span class="text-ink-400">→</span>
    ${chip('EN PROCESO','bg-amber-100 text-amber-700')} <span class="text-ink-400">→</span>
    ${chip('PENDIENTE DE DEVOLUCIÓN','bg-violet-100 text-violet-700')} <span class="text-ink-400">→</span>
    ${chip('CERRADO','bg-emerald-100 text-emerald-700')}
  </div>
  <p class="text-xs text-ink-500">…o ${chip('RECHAZADO','bg-brand-50 text-brand-600')} si el organizador no lo declara válido.</p>`)}
  <p class="text-sm text-ink-500 mt-4">Solo el <b>organizador</b> cambia los estados. En <b>cada cambio</b> tu club recibe un <b>email</b> con la actualización y la respuesta del organizador.</p>`},
{cap:'Capítulo 3 · Seguimiento', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">9. ¿Y SI RECLAMAN A TU CLUB?</h3>
  ${card(`<p class="text-sm text-ink-500 mb-2">Recibirás un <b>email</b> avisando que tu club fue reclamado. Cuando el organizador ponga el reclamo <b>EN PROCESO</b>, entra a ⚖ RECLAMOS y presenta tu defensa:</p>
  <ul class="text-sm text-ink-500 space-y-1.5">
    <li>📝 Tu <b>descargo</b> por escrito.</li>
    <li>📷 Hasta <b>3 imágenes</b> de respaldo.</li>
  </ul>
  <p class="text-xs text-ink-400 mt-2">El descargo solo puede presentarse mientras el reclamo está EN PROCESO — no lo dejes pasar.</p>`)}`},
{cap:'Capítulo 3 · Seguimiento', html:`
  <h3 class="font-display text-3xl tracking-wide mb-3">10. LA RESOLUCIÓN</h3>
  <div class="grid sm:grid-cols-2 gap-3">
    ${card(`${chip('VÁLIDO','bg-violet-100 text-violet-700')}<p class="text-xs text-ink-500 mt-2">El organizador acoge el reclamo, aplica lo que corresponda según las bases y te <b>devuelve la tasa</b> (verás PENDIENTE DE DEVOLUCIÓN y luego CERRADO).</p>`)}
    ${card(`${chip('RECHAZADO','bg-brand-50 text-brand-600')}<p class="text-xs text-ink-500 mt-2">El reclamo no procede. La resolución llega por email con el <b>sustento del organizador</b>, y la tasa queda a disposición de la organización.</p>`)}
  </div>
  <p class="text-sm text-ink-500 mt-4">La decisión del organizador es <b>definitiva</b> dentro del torneo.</p>`},

// ── CIERRE ──────────────────────────────────────────────────
{cap:'Listo', html:`
  <div class="text-center py-8">
    <p class="text-6xl mb-4">⚖</p>
    <h2 class="font-display text-5xl tracking-wide mb-3">RECLAMA CON ORDEN Y EVIDENCIA</h2>
    <p class="text-ink-500 text-sm max-w-md mx-auto mb-6">Un buen reclamo es claro, llega a tiempo y trae pruebas. Todo queda registrado y con seguimiento por email, para que el torneo se resuelva con transparencia. ¿Dudas? Contacta al organizador de tu torneo.</p>
    <a href="/club" class="inline-block bg-brand-500 text-white font-bold px-8 py-3 rounded-xl hover:bg-brand-600">🛡 IR A MI CLUB</a>
  </div>`},
];

let IDX=0, AUTO=true, TIMER=null, T0=0;
const DUR=9000;
function render(){
  const s=SLIDES[IDX];
  $('stage').innerHTML=`<div class="slide">${s.html}</div>`;
  $('capitulo').textContent=s.cap;
  $('contador').textContent=`${IDX+1} / ${SLIDES.length}`;
  $('puntos').innerHTML=SLIDES.map((x,i)=>`<button onclick="ir(${i})" class="w-2.5 h-2.5 rounded-full ${i===IDX?'bg-brand-500':'bg-white/25 hover:bg-white/50'}"></button>`).join('');
  reiniciarBarra();
}
function reiniciarBarra(){ T0=Date.now(); $('barra').style.width='0%'; }
function tick(){
  if(!AUTO) return;
  const p=Math.min(100,(Date.now()-T0)/DUR*100);
  $('barra').style.width=p+'%';
  if(p>=100){ IDX=(IDX+1)%SLIDES.length; render(); }
}
function ir(i){ IDX=i; render(); }
function sig(){ IDX=Math.min(SLIDES.length-1,IDX+1); render(); }
function ant(){ IDX=Math.max(0,IDX-1); render(); }
function toggleAuto(){
  AUTO=!AUTO;
  $('btn-auto').textContent=AUTO?'⏸ PAUSA':'▶ AUTO';
  if(AUTO) reiniciarBarra(); else $('barra').style.width='0%';
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')sig();
  if(e.key==='ArrowLeft')ant();
  if(e.key===' '){e.preventDefault();toggleAuto();}
});
render();
TIMER=setInterval(tick,150);
</script>
</body>
</html>
