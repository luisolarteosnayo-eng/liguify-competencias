<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Liguify — Perfil de Jugador</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{
  colors:{brand:{50:'#fef2f2',100:'#fde3e3',500:'#d9232e',600:'#c11d27'},ink:{900:'#171e2e',700:'#2b3550',500:'#5b6478',400:'#8b93a7'},paper:'#faf9f7',line:'#e9e6e0'},
  fontFamily:{display:['"Bebas Neue"','sans-serif'],sans:['Inter','system-ui','sans-serif']}
}}}
</script>
<style>
  body{background:#faf9f7}
  input,textarea{outline:none}
  @media (max-width:640px){input,textarea{font-size:16px}}
</style>
<body class="text-ink-900 font-sans min-h-screen">

<header class="bg-ink-900 text-white sticky top-0 z-40">
  <div class="max-w-3xl mx-auto px-4 h-14 flex items-center gap-3">
    <a href="/" class="w-8 h-8 bg-brand-500 rounded-lg grid place-items-center font-display text-lg">L</a>
    <span class="font-display text-xl tracking-wide">LIGUIFY <span class="text-white/50">PERFIL DE JUGADOR</span></span>
    <span class="flex-1"></span>
    <span id="hdr-user" class="text-xs text-white/60 hidden sm:inline"></span>
    <button id="hdr-out" onclick="salir()" class="hidden text-xs font-bold border border-white/30 rounded-full px-4 py-1.5 hover:bg-white/10">SALIR</button>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-6" id="app">
  <p class="text-center text-ink-400 text-sm py-20 font-semibold">Cargando…</p>
</main>

<div id="modal" class="fixed inset-0 bg-black/50 z-50 hidden items-start justify-center overflow-y-auto p-4">
  <div id="modal-box" class="bg-white rounded-3xl p-6 w-full max-w-lg my-8"></div>
</div>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-ink-900 text-white text-sm font-semibold px-5 py-3 rounded-xl shadow-xl z-[60] hidden max-w-lg text-center"></div>

<script>
const sb = supabase.createClient(
  'https://bpsczjjomgzhnjxnzmhj.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwc2N6ampvbWd6aG5qeG56bWhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MDg5MTgsImV4cCI6MjA5ODA4NDkxOH0.3O92Q-3xxdCmF1LStCQrlCtz1s_EfdlayXnL_mEElOw',
  { db:{schema:'competencias'}, auth:{storageKey:'sb-competencias-jugador'} }
);
const $=id=>document.getElementById(id);
let TOKEN=null, P=null, JUGADOR_ID=null, PUEDO_EDITAR=false, ES_PADRE=false, SESION=null;

function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add('hidden'),4200);}
function abrirModal(html){$('modal-box').innerHTML=html;$('modal').classList.remove('hidden');$('modal').classList.add('flex');}
function cerrarModal(){$('modal').classList.add('hidden');$('modal').classList.remove('flex');}
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const iniciales=n=>(n||'?').split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();

/* YouTube: miniatura + link */
function ytId(u){const m=String(u||'').match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([A-Za-z0-9_-]{6,})/);return m?m[1]:null;}
function tarjetaVideo(url,titulo){
  const id=ytId(url);
  return `<a href="${esc(url)}" target="_blank" rel="noopener" class="block rounded-2xl overflow-hidden border border-line bg-white hover:shadow-md transition-shadow">
    <div class="relative aspect-video bg-ink-900 grid place-items-center">
      ${id?`<img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" class="absolute inset-0 w-full h-full object-cover"/>`:''}
      <span class="relative z-10 w-12 h-12 bg-brand-500 rounded-full grid place-items-center shadow-lg"><span style="width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:14px solid #fff;margin-left:3px"></span></span>
    </div>
    ${titulo?`<p class="px-3 py-2 text-xs font-bold truncate">${esc(titulo)}</p>`:''}
  </a>`;
}

/* ============ ARRANQUE ============ */
async function iniciar(){
  TOKEN=(location.pathname.match(/\/jugador\/([a-z0-9]+)/i)||[])[1]||new URLSearchParams(location.search).get('p');
  const {data:{session}}=await sb.auth.getSession();
  SESION=session;
  if(session){$('hdr-user').textContent=session.user.email;$('hdr-out').classList.remove('hidden');}
  if(!TOKEN){ return vistaMisPerfiles(); }
  const {data,error}=await sb.rpc('perfil_publico',{p_token:TOKEN});
  if(error||!data){$('app').innerHTML=`<div class="bg-white border border-line rounded-3xl p-10 text-center">
    <p class="font-display text-3xl tracking-wide mb-2">PERFIL NO DISPONIBLE</p>
    <p class="text-sm text-ink-400">El enlace no es válido o el perfil fue deshabilitado.</p></div>`;return;}
  P=data;
  await detectarEdicion();
  render();
  // Si quien mira es un SCOUT, su visita queda registrada (no-op para el resto)
  if(SESION){try{const r=await sb.rpc('registrar_vista_scout',{p_token:TOKEN});if(r.data===true)recargar();}catch(e){}}
}

/* Sin token: si es un padre logueado, sus hijos; si no, invitación a entrar */
async function vistaMisPerfiles(){
  if(!SESION){
    $('app').innerHTML=`<div class="bg-white border border-line rounded-3xl p-8 text-center max-w-md mx-auto">
      <p class="font-display text-3xl tracking-wide mb-2">PERFIL DE JUGADOR</p>
      <p class="text-sm text-ink-500 mb-5">Si el organizador te dio acceso como padre/madre, entra con tu email para ver y administrar el perfil de tu hijo.</p>
      ${htmlLogin()}</div>`;
    return;
  }
  const {data,error}=await sb.rpc('mis_perfiles');
  if(error){$('app').innerHTML=`<p class="text-center text-brand-600 font-bold text-sm py-16">${esc(error.message)}</p>`;return;}
  if(!data||!data.length){
    $('app').innerHTML=`<div class="bg-white border border-line rounded-3xl p-10 text-center">
      <p class="font-display text-3xl tracking-wide mb-2">SIN PERFILES ASIGNADOS</p>
      <p class="text-sm text-ink-400">Tu cuenta (${esc(SESION.user.email)}) aún no tiene jugadores asignados.<br/>Pide al organizador que registre tu email en el perfil de tu hijo.</p></div>`;
    return;
  }
  if(data.length===1){ location.href='/jugador/'+data[0].token; return; }
  $('app').innerHTML=`<h2 class="font-display text-3xl tracking-wide mb-4">MIS JUGADORES</h2>
    <div class="space-y-2">${data.map(j=>`
      <a href="/jugador/${j.token}" class="flex items-center gap-3 bg-white border border-line rounded-2xl px-4 py-3 hover:shadow-md transition-shadow">
        <span class="w-12 h-12 rounded-xl bg-ink-900 text-white grid place-items-center font-display overflow-hidden relative">${j.foto_url?`<img src="${j.foto_url}" class="absolute inset-0 w-full h-full object-cover"/>`:iniciales(j.nombres+' '+j.apellidos)}</span>
        <span class="font-bold">${esc(j.nombres)} ${esc(j.apellidos)}</span>
        <span class="flex-1"></span><span class="text-brand-600 font-bold text-sm">VER PERFIL →</span></a>`).join('')}</div>`;
}

async function detectarEdicion(){
  PUEDO_EDITAR=false; JUGADOR_ID=null;
  if(!SESION) return;
  const {data}=await sb.rpc('mis_perfiles');
  const mio=(data||[]).find(x=>x.token===TOKEN);
  if(mio){PUEDO_EDITAR=true;ES_PADRE=true;JUGADOR_ID=mio.jugador_id;return;}
  // admin de la marca: puede editar cualquier perfil habilitado que gestione
  const pj=await sb.from('perfil_jugador').select('jugador_id').eq('token',TOKEN).maybeSingle();
  if(pj.data){PUEDO_EDITAR=true;JUGADOR_ID=pj.data.jugador_id;}
}

/* ============ RENDER ============ */
function render(){
  const j=P.jugador||{}, pf=P.perfil||{}, media=P.media||[], ts=P.torneos||[], pms=P.partidos||[];
  const fotos=media.filter(m=>m.tipo==='foto'), videos=media.filter(m=>m.tipo==='video');
  const tot=(k)=>ts.reduce((s,t)=>s+(+t[k]||0),0);
  const redes=[
    pf.instagram?{ic:'📸',lb:'Instagram',url:normRed(pf.instagram,'instagram.com')}:null,
    pf.facebook?{ic:'📘',lb:'Facebook',url:normRed(pf.facebook,'facebook.com')}:null,
    pf.tiktok?{ic:'🎵',lb:'TikTok',url:normRed(pf.tiktok,'tiktok.com/@')}:null
  ].filter(Boolean);
  const videosPartido=pms.filter(m=>m.video);
  const statTot=(v,l,cls)=>`<div class="bg-white border border-line rounded-2xl px-3 py-3 text-center">
    <p class="font-display text-3xl ${cls||''}">${v}</p><p class="text-[10px] font-bold text-ink-400 uppercase tracking-wider">${l}</p></div>`;

  $('app').innerHTML=`
  <!-- HERO -->
  <div class="bg-ink-900 text-white rounded-3xl p-6 mb-4 relative overflow-hidden">
    <div class="flex items-center gap-5 flex-wrap relative z-10">
      <span class="w-28 h-28 rounded-2xl bg-white/10 grid place-items-center font-display text-4xl overflow-hidden relative shrink-0 border-2 border-white/20">
        ${j.foto_url?`<img src="${j.foto_url}" class="absolute inset-0 w-full h-full object-cover"/>`:iniciales((j.nombres||'')+' '+(j.apellidos||''))}</span>
      <div class="flex-1 min-w-48">
        <p class="text-[10px] uppercase tracking-widest text-white/40 font-bold">Perfil de jugador</p>
        <h1 class="font-display text-5xl tracking-wide leading-none">${esc(j.nombres)}<br/>${esc(j.apellidos)}</h1>
        <p class="text-white/60 text-xs font-bold mt-2">${j.anio?`NACIDO EN ${j.anio}`:''}${j.posicion?` · ${esc(j.posicion).toUpperCase()}`:''}${j.pie?` · PIE ${esc(j.pie).toUpperCase()}`:''}</p>
        ${redes.length?`<div class="flex gap-2 mt-3">${redes.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener" class="bg-white/10 hover:bg-white/20 border border-white/20 rounded-full px-3 py-1.5 text-xs font-bold">${r.ic} ${r.lb}</a>`).join('')}</div>`:''}
      </div>
      <button onclick="modalCompartir()" title="Compartir el perfil en redes" class="bg-white text-ink-900 text-xs font-bold px-4 py-2.5 rounded-xl hover:bg-paper">🔗 COMPARTIR</button>
      ${PUEDO_EDITAR?`<button onclick="modalEditar()" class="bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl">✏️ EDITAR PERFIL</button>${!ES_PADRE?` <button onclick="accesoPadres()" title="Como admin ya puedes editar; este botón lanza el registro de padres (para probarlo o asistir a un padre en persona)" class="bg-white/10 border border-white/20 text-white text-[11px] font-bold px-3 py-2 rounded-xl hover:bg-white/20 ml-1">👨‍👩‍👦 REGISTRO DE PADRES</button>`:``}`
        :`<button onclick="accesoPadres()" class="bg-white/10 border border-white/20 text-white text-[11px] font-bold px-4 py-2 rounded-xl hover:bg-white/20">ACCESO PADRES</button>`}
    </div>
    ${pf.bio?`<p class="relative z-10 text-sm text-white/80 mt-4 border-t border-white/10 pt-3">${esc(pf.bio)}</p>`:''}
  </div>

  ${+P.scout_vistas?`<div class="bg-gradient-to-r from-amber-400 to-amber-300 text-ink-900 rounded-2xl px-5 py-3.5 mb-4 flex items-center gap-3 shadow-sm">
    <span class="text-2xl">🔭</span>
    <p class="font-bold text-sm">${P.scout_vistas===1?'1 scout de equipo profesional vio este perfil':P.scout_vistas+' scouts de equipos profesionales vieron este perfil'}</p>
  </div>`:''}

  <!-- TOTALES OFICIALES -->
  <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 mb-5">
    ${statTot(tot('pj'),'Partidos')}
    ${statTot(tot('goles'),'Goles','text-brand-600')}
    ${statTot(tot('asistencias'),'Asistencias')}
    ${statTot(tot('minutos'),'Minutos')}
    ${statTot(tot('amarillas'),'🟨','text-yellow-500')}
    ${statTot(tot('rojas'),'🟥','text-brand-600')}
  </div>

  ${fotos.length?`<h2 class="font-display text-2xl tracking-wide mb-2">📸 GALERÍA</h2>
  <div class="grid grid-cols-3 gap-2 mb-5">${fotos.map(f=>`
    <a href="${esc(f.url)}" target="_blank" class="block aspect-square rounded-2xl overflow-hidden border border-line bg-white"><img src="${esc(f.url)}" class="w-full h-full object-cover"/></a>`).join('')}</div>`:''}

  ${videos.length?`<h2 class="font-display text-2xl tracking-wide mb-2">🎬 MIS VIDEOS</h2>
  <div class="grid sm:grid-cols-2 gap-3 mb-5">${videos.map(v=>tarjetaVideo(v.url,v.titulo)).join('')}</div>`:''}

  <h2 class="font-display text-2xl tracking-wide mb-2">🏆 TORNEOS</h2>
  <div class="space-y-2 mb-5">${ts.map(t=>`
    <div class="bg-white border border-line rounded-2xl px-4 py-3">
      <div class="flex items-center gap-3 flex-wrap">
        <span class="w-10 h-10 rounded-lg grid place-items-center text-white text-xs font-bold overflow-hidden relative shrink-0" style="background:${t.escudo?'#fff':(t.color||'#334155')}">${t.escudo?`<img src="${t.escudo}" class="absolute inset-0 w-full h-full object-contain"/>`:iniciales(t.club)}</span>
        <div class="flex-1 min-w-40">
          <p class="font-bold text-sm">${esc(t.torneo)}</p>
          <p class="text-[11px] text-ink-400 font-semibold">${esc(t.club)} · ${esc(t.categoria)} · ${esc(t.marca)}</p>
        </div>
        <div class="flex gap-3 text-center text-xs font-bold">
          <span title="Partidos jugados">${t.pj} <span class="text-ink-400 font-semibold">PJ</span></span>
          <span title="Goles" class="text-brand-600">${t.goles} ⚽</span>
          ${+t.asistencias?`<span title="Asistencias">${t.asistencias} 🅰</span>`:''}
          ${+t.amarillas?`<span>${t.amarillas} 🟨</span>`:''}
          ${+t.rojas?`<span>${t.rojas} 🟥</span>`:''}
        </div>
      </div>
    </div>`).join('')||'<p class="text-sm text-ink-400">Aún sin torneos registrados.</p>'}</div>

  ${videosPartido.length?`<h2 class="font-display text-2xl tracking-wide mb-2">📺 VIDEOS DE SUS PARTIDOS</h2>
  <div class="grid sm:grid-cols-2 gap-3 mb-5">${videosPartido.slice(0,6).map(m=>tarjetaVideo(m.video,`${m.mi_club} ${m.local?m.gl+' : '+m.gv:m.gv+' : '+m.gl} ${m.rival} · ${m.torneo}`)).join('')}</div>`:''}

  <h2 class="font-display text-2xl tracking-wide mb-2">📅 HISTORIAL DE PARTIDOS</h2>
  <div class="bg-white border border-line rounded-2xl overflow-hidden mb-8">${pms.slice(0,60).map(m=>{
    const marc=m.local?`${m.gl??0} : ${m.gv??0}`:`${m.gv??0} : ${m.gl??0}`;
    const gano=m.local?(m.gl>m.gv):(m.gv>m.gl), emp=m.gl===m.gv;
    return `<div class="flex items-center gap-2 px-4 py-2.5 border-b border-line last:border-0 text-sm flex-wrap">
      <span class="text-[10px] text-ink-400 font-bold w-16 shrink-0">${m.fecha?m.fecha.split('-').reverse().slice(0,2).join('/')+'/'+m.fecha.slice(2,4):''}</span>
      <span class="w-9 text-center font-display text-base rounded-lg px-1 ${emp?'bg-paper text-ink-500':gano?'bg-emerald-100 text-emerald-700':'bg-brand-50 text-brand-600'}">${marc}</span>
      <span class="flex-1 min-w-32 font-bold text-xs truncate">vs ${esc(m.rival)}</span>
      <span class="text-[10px] text-ink-400 font-semibold hidden sm:inline truncate max-w-32">${esc(m.torneo)}</span>
      <span class="flex gap-1.5 text-[11px] font-bold shrink-0">
        ${m.goles?`<span class="text-brand-600">⚽${m.goles>1?'×'+m.goles:''}</span>`:''}
        ${m.amarillas?'<span>🟨</span>':''}${m.rojas?'<span>🟥</span>':''}
        ${m.jugo&&!m.goles&&!m.amarillas&&!m.rojas?'<span class="text-emerald-600" title="Jugó">✓</span>':''}
      </span>
      ${m.video?`<a href="${esc(m.video)}" target="_blank" rel="noopener" class="bg-brand-500 text-white text-[10px] font-bold rounded-full px-2.5 py-1 hover:bg-brand-600 shrink-0">▶ VIDEO</a>`:''}
    </div>`;}).join('')||'<p class="text-sm text-ink-400 p-5">Aún sin partidos finalizados.</p>'}</div>

  <p class="text-center text-[10px] text-ink-400 font-bold tracking-widest pb-8">⚡ POWERED BY LIGUIFY · liguify.com</p>`;
}
function normRed(v,dom){v=String(v).trim();if(/^https?:\/\//i.test(v))return v;return 'https://www.'+dom.replace(/\/@$/,'/@')+(dom.endsWith('@')?'':'/')+v.replace(/^@/,dom.endsWith('@')?'':'@').replace(/^@/,'');}

/* ============ LOGIN (padres) ============ */
/* ============ COMPARTIR EL PERFIL ============ */
function modalCompartir(){
  const j=P.jugador||{};
  const url=location.origin+'/jugador/'+TOKEN;
  const titulo=`Perfil de ${j.nombres||''} ${j.apellidos||''} en Liguify`;
  const texto=`⚽ Mira el perfil de jugador de ${j.nombres||''} ${j.apellidos||''}: estadísticas, fotos y videos.`;
  const puedeNativo=!!navigator.share;
  const btn=(ic,lb,on,cls)=>`<button onclick="${on}" class="flex items-center gap-3 w-full border border-line rounded-xl px-4 py-3 text-sm font-bold hover:bg-paper ${cls||''}"><span class="text-xl w-7 text-center">${ic}</span>${lb}</button>`;
  abrirModal(`<div class="flex items-center justify-between mb-1"><h3 class="font-display text-2xl tracking-wide">🔗 COMPARTIR PERFIL</h3><button onclick="cerrarModal()" class="text-ink-400 text-xl">✕</button></div>
    <p class="text-xs text-ink-500 mb-3">Comparte el perfil de <b>${esc(j.nombres||'')} ${esc(j.apellidos||'')}</b> con familia, amigos o en tus redes.</p>
    <div class="flex gap-2 items-center bg-paper border border-line rounded-xl px-3 py-2 mb-3">
      <input readonly value="${esc(url)}" onclick="this.select()" class="flex-1 min-w-0 bg-transparent text-xs font-semibold"/>
      <button onclick="copiarLinkPerfil()" class="bg-ink-900 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg hover:bg-ink-700">COPIAR</button>
    </div>
    <div class="space-y-2">
      ${puedeNativo?btn('📲','Compartir… (Instagram, TikTok, WhatsApp y más)','compartirNativo()','bg-brand-50 border-brand-100'):''}
      ${btn('📘','Facebook',`window.open('https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}','_blank','noopener,width=600,height=500')`)}
      ${btn('💬','WhatsApp',`window.open('https://wa.me/?text=${encodeURIComponent(texto+' '+url)}','_blank','noopener')`)}
      ${btn('📸','Instagram — copiar enlace para tu historia o bio',"copiarLinkPerfil('Instagram')")}
      ${btn('🎵','TikTok — copiar enlace para tu perfil o video',"copiarLinkPerfil('TikTok')")}
    </div>
    <p class="text-[10px] text-ink-400 mt-3">Instagram y TikTok no reciben enlaces desde la web: en el celular usa <b>Compartir…</b> para elegirlos directamente; en computadora copia el enlace y pégalo en tu historia, bio o descripción.</p>`);
  window.__SHARE={url,titulo,texto};
}
async function copiarLinkPerfil(red){
  const s=window.__SHARE||{url:location.href};
  try{await navigator.clipboard.writeText(s.url);}catch(e){const i=document.createElement('input');i.value=s.url;document.body.appendChild(i);i.select();document.execCommand('copy');i.remove();}
  toast(red?`Enlace copiado ✔ — pégalo en ${red}`:'Enlace copiado ✔');
}
async function compartirNativo(){
  const s=window.__SHARE; if(!s||!navigator.share) return;
  try{await navigator.share({title:s.titulo,text:s.texto,url:s.url});}catch(e){}
}

function htmlLogin(){return `
  <button onclick="entrarGoogle()" class="w-full bg-white border-2 border-line rounded-xl py-2.5 text-sm font-bold hover:bg-paper mb-3">Entrar con Google</button>
  <div class="flex items-center gap-2 text-[10px] text-ink-400 font-bold mb-3"><span class="flex-1 border-t border-line"></span>O CON TU EMAIL<span class="flex-1 border-t border-line"></span></div>
  <input id="lg-e" type="email" placeholder="tu@correo.com" class="w-full border-b border-line py-2 text-sm font-semibold mb-2 bg-transparent"/>
  <input id="lg-p" type="password" placeholder="Contraseña" class="w-full border-b border-line py-2 text-sm font-semibold mb-3 bg-transparent"/>
  <div class="flex gap-2">
    <button onclick="entrar()" class="flex-1 bg-ink-900 text-white rounded-xl py-2.5 text-sm font-bold hover:bg-ink-700">ENTRAR</button>
    <button onclick="crearCuenta()" class="flex-1 bg-white border border-line rounded-xl py-2.5 text-sm font-bold hover:bg-paper">CREAR CUENTA</button>
  </div>
  <p id="lg-msg" class="text-xs text-brand-600 font-bold mt-2"></p>`;}
function modalLogin(){abrirModal(`<div class="flex items-center justify-between mb-3"><h3 class="font-display text-2xl tracking-wide">ACCESO PADRES</h3><button onclick="cerrarModal()" class="text-ink-400 text-xl">✕</button></div>
  <p class="text-xs text-ink-500 mb-4">Entra con el email que registró el organizador. Podrás editar el perfil, subir fotos y agregar videos.</p>${htmlLogin()}`);}
async function entrar(){const {error}=await sb.auth.signInWithPassword({email:$('lg-e').value.trim(),password:$('lg-p').value});
  if(error){$('lg-msg').textContent='No se pudo entrar: '+error.message;return;} location.reload();}
async function crearCuenta(){const email=$('lg-e').value.trim(),pass=$('lg-p').value;
  if(!email||pass.length<6){$('lg-msg').textContent='Escribe tu email y una contraseña de al menos 6 caracteres.';return;}
  const {error}=await sb.auth.signUp({email,password:pass});
  if(error){$('lg-msg').textContent='No se pudo crear la cuenta: '+error.message;return;} location.reload();}
async function entrarGoogle(){const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
  if(error)$('lg-msg').textContent='Google: '+error.message;}
async function salir(){await sb.auth.signOut({scope:'local'});location.reload();}

/* ============ REGISTRO DE PADRES (autoservicio · piloto) ============ */
let W={doc:'',fnac:''};   // datos validados del paso 1, se reenvían al final
function accesoPadres(){
  if(!SESION){ modalLogin(); return; }
  pasoValidarJugador();
}
function pasoValidarJugador(){
  abrirModal(`<div class="flex items-center justify-between mb-1"><h3 class="font-display text-2xl tracking-wide">👨‍👩‍👦 ACCESO PADRES <span class="text-ink-400 text-sm font-sans font-bold">· paso 1 de 3</span></h3><button onclick="cerrarModal()" class="text-ink-400 text-xl">✕</button></div>
    <p class="text-xs text-ink-500 mb-4">Para registrarte como padre/madre de <b>${esc((P.jugador||{}).nombres||'')} ${esc((P.jugador||{}).apellidos||'')}</b>, primero valida sus datos. Deben coincidir exactamente con los registrados por su club.</p>
    <label class="block text-sm mb-3"><span class="text-ink-400 font-semibold text-xs">N° de documento del jugador (DNI)</span>
      <input id="vp-doc" value="${esc(W.doc)}" inputmode="numeric" autocomplete="off" class="w-full border-b border-line py-2 font-semibold bg-transparent"/></label>
    <label class="block text-sm mb-4"><span class="text-ink-400 font-semibold text-xs">Fecha de nacimiento del jugador</span>
      <input id="vp-fnac" type="date" value="${esc(W.fnac)}" class="w-full border-b border-line py-2 font-semibold bg-transparent"/></label>
    <button onclick="validarJugadorPadre()" class="w-full bg-brand-500 text-white font-bold py-2.5 rounded-xl hover:bg-brand-600">VALIDAR</button>
    <p id="vp-msg" class="text-xs text-brand-600 font-bold mt-2"></p>`);
}
async function validarJugadorPadre(){
  const doc=$('vp-doc').value.trim(), fnac=$('vp-fnac').value;
  if(!doc||!fnac){$('vp-msg').textContent='Completa el documento y la fecha de nacimiento.';return;}
  const r=await sb.rpc('validar_jugador_padre',{p_token:TOKEN,p_doc:doc,p_fnac:fnac});
  if(r.error){$('vp-msg').textContent=r.error.message;return;}
  if(!r.data||!r.data.ok){$('vp-msg').textContent=r.data?r.data.msg:'No se pudo validar.';return;}
  W={doc,fnac};
  pasoTerminos();
}
function pasoTerminos(){
  abrirModal(`<div class="flex items-center justify-between mb-1"><h3 class="font-display text-2xl tracking-wide">📄 TÉRMINOS Y CONDICIONES <span class="text-ink-400 text-sm font-sans font-bold">· paso 2 de 3</span></h3><button onclick="cerrarModal()" class="text-ink-400 text-xl">✕</button></div>
    <div class="bg-paper border border-line rounded-xl p-4 text-xs text-ink-700 leading-relaxed max-h-64 overflow-y-auto mb-3">
      <p class="font-bold mb-2">Perfil público de jugador — condiciones de uso (padres/tutores)</p>
      <p class="mb-2"><b>1. Declaración.</b> Declaro ser padre, madre o tutor legal del jugador menor de edad y contar con la facultad para administrar su perfil.</p>
      <p class="mb-2"><b>2. Contenido del perfil.</b> El perfil muestra información deportiva oficial (estadísticas y resultados de los torneos) junto con el contenido que yo agregue: fotos, enlaces de video, presentación y redes sociales. Soy responsable de que ese contenido sea apropiado y pertenezca al jugador.</p>
      <p class="mb-2"><b>3. Uso de imagen.</b> Autorizo la publicación de las fotos y videos que yo suba al perfil, que será visible para quien tenga el enlace. Puedo eliminarlos en cualquier momento desde el propio perfil.</p>
      <p class="mb-2"><b>4. Datos personales.</b> Mis datos de contacto (nombre, teléfono, email) y la imagen de mi documento se usan únicamente para verificar mi identidad como responsable del menor; se guardan en almacenamiento privado y no se publican.</p>
      <p class="mb-2"><b>5. Veracidad.</b> La información que registro es verdadera. El organizador puede suspender el acceso ante uso indebido o suplantación.</p>
      <p><b>6. Revocación.</b> Puedo solicitar al organizador la desactivación del perfil o de mi acceso en cualquier momento.</p>
    </div>
    <label class="flex items-start gap-2 text-sm font-semibold mb-4">
      <input id="tc-ok" type="checkbox" class="w-4 h-4 mt-0.5 accent-[#d9232e]"/>
      <span>He leído y <b>acepto</b> los términos y condiciones.</span></label>
    <div class="flex gap-2">
      <button onclick="pasoValidarJugador()" class="flex-1 border border-line text-ink-500 text-sm font-bold py-2.5 rounded-xl hover:bg-paper">← VOLVER</button>
      <button onclick="if(!$('tc-ok').checked){toast('Debes aceptar los términos para continuar');return;} pasoRegistroPadre()" class="flex-1 bg-brand-500 text-white text-sm font-bold py-2.5 rounded-xl hover:bg-brand-600">CONTINUAR</button>
    </div>`);
}
function pasoRegistroPadre(){
  abrirModal(`<div class="flex items-center justify-between mb-1"><h3 class="font-display text-2xl tracking-wide">📝 TUS DATOS <span class="text-ink-400 text-sm font-sans font-bold">· paso 3 de 3</span></h3><button onclick="cerrarModal()" class="text-ink-400 text-xl">✕</button></div>
    <p class="text-xs text-ink-500 mb-4">Datos del padre/madre responsable. La foto de tu DNI se guarda en almacenamiento <b>privado</b> (no se publica) y sirve para verificar tu identidad.</p>
    <label class="block text-sm mb-3"><span class="text-ink-400 font-semibold text-xs">Nombre y apellido *</span>
      <input id="rp-nom" class="w-full border-b border-line py-2 font-semibold bg-transparent"/></label>
    <div class="grid grid-cols-2 gap-3 mb-3">
      <label class="block text-sm"><span class="text-ink-400 font-semibold text-xs">Teléfono *</span>
        <input id="rp-tel" inputmode="tel" class="w-full border-b border-line py-2 font-semibold bg-transparent"/></label>
      <label class="block text-sm"><span class="text-ink-400 font-semibold text-xs">Email</span>
        <input value="${esc(SESION.user.email)}" readonly class="w-full border-b border-line py-2 font-semibold bg-transparent text-ink-400"/></label>
    </div>
    <p class="font-bold text-ink-500 uppercase tracking-wider text-[10px] mb-1">Foto de TU DNI (ambos lados) *</p>
    <label class="block text-sm mb-2"><span class="text-ink-400 font-semibold text-xs">Frontal</span>
      <input id="rp-dfr" type="file" accept="image/*" class="w-full text-xs mt-1"/></label>
    <label class="block text-sm mb-4"><span class="text-ink-400 font-semibold text-xs">Reverso</span>
      <input id="rp-drv" type="file" accept="image/*" class="w-full text-xs mt-1"/></label>
    <button id="rp-btn" onclick="enviarRegistroPadre()" class="w-full bg-brand-500 text-white font-bold py-2.5 rounded-xl hover:bg-brand-600">COMPLETAR REGISTRO</button>
    <p id="rp-msg" class="text-xs text-brand-600 font-bold mt-2"></p>`);
}
async function subirDniPadre(inputId,lado){
  let f=$(inputId).files[0]; if(!f) return null;
  f=await redimensionar(f,1400,0.85);
  const ruta=`padres/${SESION.user.id}-${lado}-${Date.now()}.jpg`;
  const up=await sb.storage.from('documentos').upload(ruta,f,{contentType:'image/jpeg',upsert:false});   // sin upsert: solo necesita permiso de INSERT
  if(up.error) throw new Error('DNI '+lado+': '+up.error.message);
  return ruta;
}
async function enviarRegistroPadre(){
  const nom=$('rp-nom').value.trim(), tel=$('rp-tel').value.trim();
  if(!nom){$('rp-msg').textContent='Tu nombre y apellido son obligatorios.';return;}
  if(!tel){$('rp-msg').textContent='El teléfono es obligatorio.';return;}
  if(!$('rp-dfr').files[0]||!$('rp-drv').files[0]){$('rp-msg').textContent='Sube la foto de tu DNI por ambos lados.';return;}
  $('rp-btn').disabled=true; $('rp-btn').textContent='Registrando…'; $('rp-msg').textContent='';
  try{
    const fr=await subirDniPadre('rp-dfr','frente');
    const rv=await subirDniPadre('rp-drv','reverso');
    const r=await sb.rpc('registrar_acceso_padre',{p_token:TOKEN,p_doc:W.doc,p_fnac:W.fnac,
      p_nombre:nom,p_telefono:tel,p_dni_frente:fr,p_dni_reverso:rv});
    if(r.error) throw new Error(r.error.message);
    if(!r.data||!r.data.ok) throw new Error(r.data?r.data.msg:'No se pudo completar el registro');
    // email de confirmación (no bloquea si la función aún no está desplegada)
    let mail=false;
    try{const em=await sb.functions.invoke('enviar-confirmacion-padre',{body:{jugador_id:r.data.jugador_id}}); mail=!em.error&&em.data&&em.data.ok;}catch(e){}
    abrirModal(`<div class="text-center py-4">
      <p class="text-5xl mb-3">✅</p>
      <h3 class="font-display text-3xl tracking-wide mb-2">ACCESO APROBADO</h3>
      <p class="text-sm text-ink-500 mb-1">Ya puedes administrar el perfil de <b>${esc(r.data.jugador)}</b>.</p>
      <p class="text-xs text-ink-400 mb-5">${mail?'Te enviamos un email de confirmación a '+esc(r.data.email)+'.':'Entra siempre con este mismo correo: '+esc(r.data.email)+'.'}</p>
      <button onclick="location.reload()" class="bg-brand-500 text-white font-bold px-8 py-2.5 rounded-xl hover:bg-brand-600">IR AL PERFIL</button>
    </div>`);
  }catch(e){
    $('rp-msg').textContent='⚠ '+(e.message||e);
    $('rp-btn').disabled=false; $('rp-btn').textContent='COMPLETAR REGISTRO';
  }
}

/* ============ EDICIÓN (padre o admin) ============ */
function modalEditar(){
  const pf=P.perfil||{}, media=P.media||[], fotos=media.filter(m=>m.tipo==='foto'), videos=media.filter(m=>m.tipo==='video');
  abrirModal(`<div class="flex items-center justify-between mb-3"><h3 class="font-display text-2xl tracking-wide">✏️ EDITAR PERFIL</h3><button onclick="cerrarModal()" class="text-ink-400 text-xl">✕</button></div>
  <label class="block text-sm mb-3"><span class="text-ink-400 font-semibold text-xs">Presentación (bio corta)</span>
    <textarea id="ed-bio" rows="2" maxlength="280" class="w-full border border-line rounded-xl p-2.5 text-sm font-semibold">${esc(pf.bio||'')}</textarea></label>
  <div class="grid grid-cols-3 gap-2 mb-4">
    <label class="text-sm"><span class="text-ink-400 font-semibold text-[10px]">📸 Instagram</span><input id="ed-ig" value="${esc(pf.instagram||'')}" placeholder="@usuario" class="w-full border-b border-line py-1.5 text-xs font-semibold bg-transparent"/></label>
    <label class="text-sm"><span class="text-ink-400 font-semibold text-[10px]">📘 Facebook</span><input id="ed-fb" value="${esc(pf.facebook||'')}" placeholder="usuario o link" class="w-full border-b border-line py-1.5 text-xs font-semibold bg-transparent"/></label>
    <label class="text-sm"><span class="text-ink-400 font-semibold text-[10px]">🎵 TikTok</span><input id="ed-tk" value="${esc(pf.tiktok||'')}" placeholder="@usuario" class="w-full border-b border-line py-1.5 text-xs font-semibold bg-transparent"/></label>
  </div>
  <button onclick="guardarPerfil()" class="w-full bg-brand-500 text-white text-sm font-bold py-2.5 rounded-xl hover:bg-brand-600 mb-5">GUARDAR DATOS</button>

  <p class="font-bold text-ink-500 uppercase tracking-wider text-[10px] mb-2">📸 Fotos (${fotos.length}/3)</p>
  <div class="flex gap-2 mb-2">${fotos.map(f=>`
    <span class="relative w-20 h-20 rounded-xl overflow-hidden border border-line"><img src="${esc(f.url)}" class="w-full h-full object-cover"/>
      <button onclick="quitarMedia('${f.id}')" class="absolute top-0.5 right-0.5 bg-black/60 text-white w-5 h-5 rounded-full text-[10px] font-bold">✕</button></span>`).join('')}</div>
  ${fotos.length<3?`<input id="ed-foto" type="file" accept="image/*" class="text-xs mb-1"/>
  <button onclick="subirFoto()" class="w-full bg-ink-900 text-white text-xs font-bold py-2 rounded-xl hover:bg-ink-700 mb-4">SUBIR FOTO</button>`:'<p class="text-[10px] text-ink-400 mb-4">Límite alcanzado: elimina una para subir otra.</p>'}

  <p class="font-bold text-ink-500 uppercase tracking-wider text-[10px] mb-2">🎬 Videos (${videos.length}/8)</p>
  ${videos.map(v=>`<div class="flex items-center gap-2 text-xs font-semibold py-1 border-b border-line">
    <span class="flex-1 truncate">${esc(v.titulo||v.url)}</span>
    <button onclick="quitarMedia('${v.id}')" class="text-ink-400 hover:text-brand-600 font-bold">✕</button></div>`).join('')}
  ${videos.length<8?`<input id="ed-vurl" placeholder="Link del video (YouTube, TikTok…)" class="w-full border-b border-line py-1.5 text-xs font-semibold bg-transparent mt-2"/>
  <input id="ed-vtit" placeholder="Título (ej. Golazo vs River)" class="w-full border-b border-line py-1.5 text-xs font-semibold bg-transparent mb-2"/>
  <button onclick="agregarVideo()" class="w-full bg-ink-900 text-white text-xs font-bold py-2 rounded-xl hover:bg-ink-700">AGREGAR VIDEO</button>`:''}
  <p class="text-[10px] text-ink-400 mt-3">Las estadísticas y el historial de partidos son oficiales del torneo y se actualizan solos.</p>`);
}
async function guardarPerfil(){
  const {error}=await sb.from('perfil_jugador').update({
    bio:$('ed-bio').value.trim()||null, instagram:$('ed-ig').value.trim()||null,
    facebook:$('ed-fb').value.trim()||null, tiktok:$('ed-tk').value.trim()||null,
    updated_at:new Date().toISOString()}).eq('jugador_id',JUGADOR_ID);
  if(error){toast('⚠ '+error.message);return;}
  toast('Perfil guardado ✔'); cerrarModal(); recargar();
}
async function redimensionar(file,max,calidad){
  return new Promise(res=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>res(new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'})),'image/jpeg',calidad);};
    img.src=URL.createObjectURL(file);});
}
async function subirFoto(){
  let f=$('ed-foto').files[0]; if(!f){toast('Elige una imagen');return;}
  f=await redimensionar(f,1200,0.85);
  const ruta=`perfil/${JUGADOR_ID}-${Date.now()}.jpg`;
  const up=await sb.storage.from('publico').upload(ruta,f,{contentType:'image/jpeg'});
  if(up.error){toast('⚠ '+up.error.message);return;}
  const url=sb.storage.from('publico').getPublicUrl(ruta).data.publicUrl;
  const ins=await sb.from('perfil_media').insert({jugador_id:JUGADOR_ID,tipo:'foto',url});
  if(ins.error){toast('⚠ '+ins.error.message);return;}
  toast('Foto agregada ✔'); recargar(true);
}
async function agregarVideo(){
  let u=$('ed-vurl').value.trim(); if(!u){toast('Pega el link del video');return;}
  if(!/^https?:\/\//i.test(u)) u='https://'+u;
  const {error}=await sb.from('perfil_media').insert({jugador_id:JUGADOR_ID,tipo:'video',url:u,titulo:$('ed-vtit').value.trim()||null});
  if(error){toast('⚠ '+error.message);return;}
  toast('Video agregado ✔'); recargar(true);
}
async function quitarMedia(id){
  if(!confirm('¿Eliminar este elemento del perfil?'))return;
  const {error}=await sb.from('perfil_media').delete().eq('id',id);
  if(error){toast('⚠ '+error.message);return;}
  recargar(true);
}
async function recargar(reabrirEditor){
  const {data}=await sb.rpc('perfil_publico',{p_token:TOKEN});
  if(data){P=data;render();if(reabrirEditor)modalEditar();}
}

iniciar();
</script>
</body>
