tailwind.config={theme:{extend:{
  colors:{brand:{50:'#fef2f2',100:'#fde3e3',500:'#d9232e',600:'#c11d27'},ink:{900:'#171e2e',700:'#2b3550',500:'#5b6478',400:'#8b93a7'},paper:'#faf9f7',line:'#e9e6e0'},

<style>

  .screen{display:none}.screen.active{display:block}
  .fade{animation:f .22s ease}@keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

<body class="text-ink-900 font-sans min-h-screen">

<header class="bg-white/90 backdrop-blur border-b border-line sticky top-0 z-40">
  <div class="max-w-5xl mx-auto px-4 h-16 flex items-center gap-3">
    <button onclick="irCatalogo()" class="flex items-center gap-2.5">
      <span class="w-9 h-9 rounded-xl bg-brand-500 grid place-items-center text-white font-display text-xl pt-0.5">L</span>
      <span class="text-left leading-tight">
        <span id="hdr-brand" class="font-display text-2xl tracking-wide block">LIGUIFY</span>
        <span id="hdr-sub" class="text-[10px] text-ink-400 font-semibold tracking-widest uppercase block -mt-1">Torneos en vivo</span>
      </span>
    </button>
    <nav class="ml-auto flex items-center gap-1.5 text-xs font-semibold">
      <button id="btn-a2hs" onclick="instalarApp()" class="hidden items-center gap-1 border border-line rounded-xl px-2.5 py-2 text-ink-500 hover:text-ink-900 hover:bg-paper transition" title="Pon Liguify en la pantalla de inicio de tu celular, como una app">📲<span class="hidden md:inline"> App</span></button>
      <a href="club.html"
         class="flex items-center gap-1.5 bg-ink-900 text-white rounded-xl px-3 py-2 hover:bg-ink-700 transition" title="Acceso para coordinadores y delegados de club: gestiona tu LBF, mira tus partidos y tu tabla">
        🛡️ <span>Mi Club</span>
      </a>
      <a href="https://liguify-academias.vercel.app" target="_blank" rel="noopener"
         class="flex items-center gap-1.5 border border-line rounded-xl px-3 py-2 text-ink-500 hover:text-ink-900 hover:bg-paper transition" title="Módulo de gestión de academias deportivas">
        🎓 <span class="hidden sm:inline">Academias</span>
      </a>
      <a href="https://erp.liguify.com" target="_blank" rel="noopener"
         class="flex items-center gap-1.5 border border-line rounded-xl px-3 py-2 text-ink-500 hover:text-ink-900 hover:bg-paper transition" title="Módulo financiero de torneos (inscripciones, pagos, cuentas por cobrar)">
        💰 <span class="hidden sm:inline">Financiero</span>
      </a>
    </nav>
    <span id="hdr-rt" class="text-[10px] font-bold text-ink-400 flex items-center gap-1.5"></span>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-6 pb-24 md:pb-8">
  <div id="err" class="hidden bg-brand-50 border border-brand-100 text-brand-600 text-sm font-semibold rounded-2xl px-4 py-3 mb-4"></div>

  <!-- CATÁLOGO DE MARCAS -->
  <section id="s-catalogo" class="screen">
    <h1 class="font-display text-4xl tracking-wide mb-1">CAMPEONATOS</h1>
    <p class="text-ink-500 text-sm mb-6">Marcas organizadoras — datos en vivo desde la base de datos</p>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4" id="catalogo"></div>
    <button onclick="modalRegistroTorneo()" class="mt-6 w-full border-2 border-dashed border-brand-500/50 bg-white/60 rounded-2xl px-5 py-4 text-left hover:bg-white hover:shadow-md transition">
      <span class="font-display text-2xl tracking-wide text-brand-600">➕ ¿ORGANIZAS UN TORNEO?</span>
      <span class="block text-xs text-ink-500 mt-0.5">Regístralo aquí: te contactamos y lo damos de alta en Liguify con su propia página, fixture, tablas y módulo de clubes.</span>
    </button>
  </section>

  <!-- TORNEOS DE LA MARCA -->
  <section id="s-torneos" class="screen">
    <button onclick="irCatalogo()" class="text-sm text-ink-500 mb-4 font-semibold">← Campeonatos</button>
    <div class="rounded-2xl bg-ink-900 text-white p-6 sm:p-8 mb-6 relative overflow-hidden">
      <div class="absolute inset-0 opacity-25" style="background:radial-gradient(circle at 82% 18%, #d9232e 0%, transparent 55%)"></div>
      <div id="m-wm" class="absolute -right-6 -top-10 font-display text-[150px] opacity-[.07] tracking-wide"></div>
      <div class="relative">
        <p id="m-meta" class="inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1 text-[11px] font-semibold uppercase tracking-wider"></p>
        <h1 id="m-nombre" class="font-display text-5xl sm:text-6xl tracking-wide mt-2"></h1>
        <p id="m-sub" class="text-white/60 text-sm mt-1"></p>
      </div>
    </div>
    <h2 class="font-display text-2xl tracking-wide mb-3">TORNEOS</h2>

  </section>

  <!-- CATEGORÍAS DEL TORNEO -->
  <section id="s-categorias" class="screen">
    <button onclick="irMarca()" class="text-sm text-ink-500 mb-4 font-semibold" id="bc-marca"></button>
    <div class="rounded-2xl bg-ink-900 text-white p-6 sm:p-8 mb-4 relative overflow-hidden">
      <div class="absolute inset-0 opacity-25" style="background:radial-gradient(circle at 82% 18%, #d9232e 0%, transparent 55%)"></div>
      <div class="relative">
        <p id="t-meta" class="inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1 text-[11px] font-semibold uppercase tracking-wider"></p>
        <h1 id="t-nombre" class="font-display text-4xl sm:text-6xl tracking-wide mt-2"></h1>
      </div>
    </div>
    <div id="t-kpis"></div>
    <div id="t-home"></div>
    <div id="t-docs" class="mb-4"></div>
    <div id="t-general"></div>
    <h2 class="font-display text-2xl tracking-wide mb-3">CATEGORÍAS</h2>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3" id="categorias"></div>
  </section>

  <!-- CATEGORÍA: TABLA / FIXTURE / EQUIPOS -->
  <section id="s-categoria" class="screen">
    <button onclick="volverDeCategoria()" class="text-sm text-ink-500 mb-3 font-semibold" id="bc-torneo"></button>
    <div class="rounded-2xl bg-ink-900 text-white p-5 sm:p-7 mb-4 relative overflow-hidden">
      <div class="absolute inset-0 opacity-25" style="background:radial-gradient(circle at 82% 18%, #d9232e 0%, transparent 55%)"></div>
      <div class="relative">
        <p id="c-sup" class="inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1 text-[11px] font-semibold uppercase tracking-wider hidden"></p>
        <h1 id="c-nombre" class="font-display text-4xl sm:text-5xl tracking-wide"></h1>
      </div>
    </div>
    <div id="c-docs"></div>
    <div id="c-kpis"></div>
    <div class="hidden md:flex gap-1.5 mb-5" id="c-tabs"></div>
    <div id="tab-tabla" class="ctab"></div>
    <div id="tab-fixture" class="ctab hidden"></div>
    <div id="tab-llaves" class="ctab hidden"></div>
    <div id="tab-equipos" class="ctab hidden"></div>
    <!-- barra inferior (solo móvil): pestañas de la categoría -->
    <nav class="fixed inset-x-0 bottom-0 z-40 border-t border-line bg-white/95 backdrop-blur md:hidden">
      <div class="mx-auto grid max-w-md grid-cols-4" id="c-tabs-mov"></div>
    </nav>
  </section>

  <!-- MODAL: DETALLE DEL PARTIDO -->
  <div id="modal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4" onclick="if(event.target===this)cerrarModal()">
    <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[88vh] overflow-y-auto p-5" id="modal-body"></div>
  </div>

  <!-- EQUIPO: LBF PÚBLICA -->
  <section id="s-equipo" class="screen">
    <button onclick="irCategoria()" class="text-sm text-ink-500 mb-3 font-semibold" id="bc-cat"></button>
    <div id="eq-head"></div>
    <div id="eq-partidos"></div>
    <div class="bg-white rounded-2xl border border-line mt-4 overflow-hidden">
      <p class="px-5 py-3 border-b border-line font-display text-xl tracking-wide">PLANTEL · LISTA DE BUENA FE</p>
      <div id="eq-lbf"></div>
    </div>
    <div id="eq-stats"></div>
  </section>

  <!-- 🔭 SCOUT: SEGUIMIENTOS -->
  <section id="s-scout" class="screen">
    <button onclick="irCatalogo()" class="text-sm text-ink-500 mb-3 font-semibold">← Campeonatos</button>
    <div class="rounded-2xl bg-ink-900 text-white p-5 sm:p-7 mb-4 relative overflow-hidden">
      <div class="absolute inset-0 opacity-25" style="background:radial-gradient(circle at 82% 18%, #f59e0b 0%, transparent 55%)"></div>
      <div class="relative">
        <p class="inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1 text-[11px] font-semibold uppercase tracking-wider">🔭 Modo Scout</p>
        <h1 class="font-display text-4xl sm:text-5xl tracking-wide mt-2">SEGUIMIENTOS</h1>
      </div>
    </div>
    <div id="scout-lista"></div>
  </section>
</main>

<footer class="max-w-5xl mx-auto px-4 py-10 text-center text-xs text-ink-400">
  ⚡ Powered by Liguify — datos en tiempo real desde Supabase
</footer>

<script>
const sb = supabase.createClient(
  'https://bpsczjjomgzhnjxnzmhj.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwc2N6ampvbWd6aG5qeG56bWhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MDg5MTgsImV4cCI6MjA5ODA4NDkxOH0.3O92Q-3xxdCmF1LStCQrlCtz1s_EfdlayXnL_mEElOw',
  { db:{schema:'competencias'}, auth:{persistSession:false, storageKey:'sb-competencias-pub'} }   // público: siempre anónimo, sin tocar sesiones de otras apps
);
const $=id=>document.getElementById(id);
let MARCA=null, TORNEO=null, CAT=null, EQUIPO=null;
let EQUIPOS={}, CLUBES={};

function err(msg){ const e=$('err'); if(!msg){e.classList.add('hidden');return;} e.textContent='⚠ '+msg; e.classList.remove('hidden'); }
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=$(id); el.classList.add('active','fade'); setTimeout(()=>el.classList.remove('fade'),240);
  window.scrollTo({top:0,behavior:'smooth'});
}
const iniciales=n=>(n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
/* Orden estándar de jugadores: N° de camiseta ascendente; sin número, al final en orden alfabético */
const ordCamiseta=(a,b,nomA,nomB)=>((a.dorsal??999)-(b.dorsal??999))||String(nomA||'').localeCompare(String(nomB||''),'es');
/* Pastilla "VER VIDEO" clicable desde la lista (no abre el detalle del partido) */
const videoPill=u=>`<div class="flex justify-center mt-1.5"><a href="${u}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Ver el video del partido"
  class="inline-flex items-center gap-1.5 text-[10px] font-bold text-white rounded-full pl-1.5 pr-3 py-1 shadow-md hover:shadow-lg hover:scale-105 transition" style="background:linear-gradient(135deg,#ef4444,#b91c1c)">
  <span class="grid place-items-center w-4 h-4 bg-white rounded-full shrink-0"><span style="width:0;height:0;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;border-left:6px solid #b91c1c;margin-left:1.5px"></span></span>VER VIDEO</a></div>`;
function badge(eq,sz=7){
  const cl=CLUBES[eq.club_id]||{};
  return `<span class="relative inline-grid place-items-center w-${sz} h-${sz} rounded-lg text-white text-[10px] font-bold shrink-0 overflow-hidden align-middle" style="background:${cl.escudo_url?'#fff':(cl.color||'#334155')}">${cl.escudo_url?`<img src="${cl.escudo_url}" class="absolute inset-0 w-full h-full object-contain"/>`:iniciales(cl.nombre)}${eq.color_dot?`<span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-white" style="background:${eq.color_dot}"></span>`:''}</span>`;
}
const nomEq=eq=>eq.nombre||(CLUBES[eq.club_id]||{}).nombre||'—';
/* Modal (detalle del partido) */
function abrirModal(html){$('modal-body').innerHTML=html;const m=$('modal');m.classList.remove('hidden');m.classList.add('flex');}
function cerrarModal(){const m=$('modal');m.classList.add('hidden');m.classList.remove('flex');}

/* ---- Registro público de torneos (lead → backoffice del super-admin) ---- */
function modalRegistroTorneo(){
  abrirModal(`<div class="flex items-center justify-between mb-1"><h3 class="font-display text-2xl tracking-wide">➕ REGISTRA TU TORNEO</h3><button onclick="cerrarModal()" class="text-ink-400 text-xl">✕</button></div>
    <p class="text-xs text-ink-500 mb-4">Déjanos los datos básicos y te contactamos para dar de alta tu torneo en Liguify.</p>
    <label class="block text-sm mb-3"><span class="text-ink-400 font-semibold text-xs">Nombre del torneo *</span>
      <input id="rt-n" maxlength="80" placeholder="Ej. ARRIAGOL CUP" class="w-full border-b-2 border-line py-1.5 font-semibold outline-none focus:border-brand-500"/></label>
    <div class="grid sm:grid-cols-2 gap-3 mb-3">
      <label class="block text-sm"><span class="text-ink-400 font-semibold text-xs">Nombre de contacto *</span>
        <input id="rt-c" maxlength="80" placeholder="Tu nombre" class="w-full border-b-2 border-line py-1.5 font-semibold outline-none focus:border-brand-500"/></label>
      <label class="block text-sm"><span class="text-ink-400 font-semibold text-xs">Teléfono / WhatsApp *</span>
        <input id="rt-t" maxlength="25" placeholder="999 888 777" class="w-full border-b-2 border-line py-1.5 font-semibold outline-none focus:border-brand-500"/></label>
    </div>
    <label class="block text-sm mb-1"><span class="text-ink-400 font-semibold text-xs">Email *</span>
      <input id="rt-e" type="email" maxlength="120" placeholder="tucorreo@gmail.com" class="w-full border-b-2 border-line py-1.5 font-semibold outline-none focus:border-brand-500"/></label>
    <p class="text-[11px] text-ink-400 mb-4">💡 Usa el email con el que entrarás al sistema (tu cuenta de Google u otro correo): con ese mismo te daremos el acceso de administrador.</p>
    <p id="rt-err" class="hidden text-xs font-bold text-brand-600 mb-2"></p>
    <button id="rt-btn" onclick="enviarRegistroTorneo()" class="w-full bg-brand-500 text-white font-bold py-2.5 rounded-xl hover:bg-brand-600">📨 ENVIAR SOLICITUD</button>`);
}
async function enviarRegistroTorneo(){
  const v=id=>($(id)?$(id).value.trim():'');
  const n=v('rt-n'), c=v('rt-c'), t=v('rt-t'), e=v('rt-e');
  const errEl=$('rt-err');
  const fail=m=>{errEl.textContent='⚠ '+m; errEl.classList.remove('hidden');};
  if(n.length<2) return fail('Escribe el nombre del torneo.');
  if(c.length<2) return fail('Escribe el nombre de contacto.');
  if(t.length<6) return fail('Escribe un teléfono válido.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return fail('Escribe un email válido.');
  $('rt-btn').disabled=true; $('rt-btn').textContent='Enviando…';
  const {error}=await sb.from('solicitud_torneo').insert({nombre_torneo:n, contacto:c, telefono:t, email:e});
  if(error){$('rt-btn').disabled=false;$('rt-btn').textContent='📨 ENVIAR SOLICITUD';return fail(error.message);}
  $('modal-body').innerHTML=`<div class="text-center py-8">
    <p class="text-5xl mb-3">✅</p>
    <h3 class="font-display text-3xl tracking-wide mb-2">¡SOLICITUD ENVIADA!</h3>
    <p class="text-sm text-ink-500 mb-1">Registramos <b>${n.replace(/</g,'&lt;')}</b>.</p>
    <p class="text-xs text-ink-400 mb-5">Te contactaremos a ${t.replace(/</g,'&lt;')} · ${e.replace(/</g,'&lt;')} para darlo de alta.</p>
    <button onclick="cerrarModal()" class="bg-ink-900 text-white font-bold px-6 py-2.5 rounded-xl hover:bg-ink-700">ENTENDIDO</button>
  </div>`;
}
async function abrirDetallePartido(id){
  const m=PART_IDX[id]; if(!m) return;
  const L=EQUIPOS[m.local_id], V=EQUIPOS[m.visita_id];
  const fin=['finalizado','walkover'].includes(m.estado), vivo=m.estado==='en_vivo';
  const {data:pl}=await sb.from('vista_planilla_publica').select('*').eq('partido_id',id);
  const stats=(pl||[]).filter(p=>p.jugo||p.goles||p.amarillas||p.rojas).sort((a,b)=>ordCamiseta(a,b,(a.nombres||'')+' '+(a.apellidos||''),(b.nombres||'')+' '+(b.apellidos||'')));
  const filaJ=p=>`<div class="flex items-center gap-2 py-1.5 border-b border-line last:border-0">
    <span class="w-5 text-ink-400 font-bold text-xs text-right shrink-0">${p.dorsal??''}</span>
    <span class="flex-1 min-w-0 text-sm font-semibold truncate">${p.nombres} ${p.apellidos}${p.capitan?' <span class="text-[9px] bg-ink-900 text-white rounded px-1 py-0.5 font-bold">C</span>':''}</span>
    <span class="text-sm shrink-0">${p.goles>3?'⚽×'+p.goles:'⚽'.repeat(p.goles||0)}${'🟨'.repeat(p.amarillas||0)}${'🟥'.repeat(p.rojas||0)}</span>
  </div>`;
  const col=(eqId,nom)=>{const list=stats.filter(p=>p.equipo_id===eqId);
    return `<div class="min-w-0"><p class="font-display text-lg tracking-wide border-b-2 border-ink-900 pb-1 truncate">${nom}</p>
      ${list.length?list.map(filaJ).join(''):'<p class="text-xs text-ink-400 py-3 text-center">Sin detalle registrado.</p>'}</div>`;};
  let figHTML='';
  if(m.figura_inscripcion_id){
    let f=(pl||[]).find(p=>p.inscripcion_id===m.figura_inscripcion_id);
    if(!f){const q=await sb.from('vista_lbf_publica').select('*').eq('inscripcion_id',m.figura_inscripcion_id).limit(1); f=(q.data||[])[0];}
    if(f){
      window.__FIG={m,f};
      figHTML=`<div class="mt-4 bg-ink-900 text-white rounded-2xl p-4 flex items-center gap-4 flex-wrap">
      <span class="w-20 h-20 rounded-full grid place-items-center font-bold overflow-hidden relative shrink-0 ring-4 ring-amber-400/60" style="background:#2b3550;${f.consentimiento_imagen?'':'filter:grayscale(1)'}">${f.foto_url?`<img src="${f.foto_url}" class="absolute inset-0 w-full h-full object-cover"/>`:iniciales((f.nombres||'')+' '+(f.apellidos||''))}</span>
      <div class="min-w-0 flex-1"><p class="text-[10px] font-bold tracking-widest text-amber-400 uppercase">⭐ Figura del partido</p>
        <p class="font-display text-2xl tracking-wide truncate">${f.nombres} ${f.apellidos}</p>
        <p class="text-white/50 text-xs">${EQUIPOS[f.equipo_id]?nomEq(EQUIPOS[f.equipo_id]):''}</p></div>
      <button onclick="compartirFigura()" class="bg-amber-400 text-ink-900 text-xs font-bold px-4 py-2.5 rounded-xl hover:bg-amber-300 shrink-0">📤 COMPARTIR</button>
    </div>`;
    }
  }
  const ctx=m.etapa?`🏆 ${m.etapa}`:(m.jornada&&m.jornada.numero?`Fecha ${m.jornada.numero}`:'');
  const gLd=fin&&(m.penales?(m.penales_local??0)>(m.penales_visita??0):m.goles_local>m.goles_visita);
  const gVd=fin&&(m.penales?(m.penales_visita??0)>(m.penales_local??0):m.goles_visita>m.goles_local);
  abrirModal(`<div class="flex items-center justify-between mb-3"><h3 class="font-display text-2xl tracking-wide">DETALLE DEL PARTIDO</h3><button onclick="cerrarModal()" class="text-ink-400 text-xl">✕</button></div>
    <div class="bg-ink-900 text-white rounded-2xl p-4 sm:p-5 mb-4 relative overflow-hidden">
      <div class="absolute inset-0 opacity-25" style="background:radial-gradient(circle at 85% 15%, #d9232e 0%, transparent 55%)"></div>
      <div class="relative">
        <p class="text-center mb-2">${vivo?'<span class="inline-flex items-center gap-1.5 text-[10px] font-bold text-white bg-brand-500 rounded-full px-2.5 py-1"><span class="live-dot" style="background:#fff"></span>EN VIVO</span>'
          :`<span class="inline-flex text-[10px] font-bold uppercase tracking-wider rounded-full px-2.5 py-1 ${fin?'bg-emerald-500/20 text-emerald-300':'bg-white/10 text-white/60'}">${fin?(m.estado==='walkover'?'W.O.':'FINAL'):m.estado}</span>`}</p>
        <div class="flex items-center justify-center gap-3 sm:gap-4">
          <div class="text-center flex-1 min-w-0">${L?badge(L,9):''}<p class="text-xs font-bold mt-1.5 truncate">${L?nomEq(L):'Por definir'}</p></div>

/* Imagen cuadrada de la FIGURA DEL PARTIDO (1080×1080 para redes) */
function cargarImg(url){
  return new Promise(res=>{
    if(!url){res(null);return;}
    const im=new Image(); im.crossOrigin='anonymous';
    const t=setTimeout(()=>res(null),6000);
    im.onload=()=>{clearTimeout(t);res(im)};
    im.onerror=()=>{clearTimeout(t);res(null)};
    im.src=url;
  });
}

    for(;s>18;s--){x.font=font.replace(/\d+px/,s+'px'); if(x.measureText(t).width<=max) break;} return x.font;};
  const circulo=(img,cx,cy,r,color,ini,bn)=>{
    x.save(); x.beginPath(); x.arc(cx,cy,r,0,7); x.clip();

      x.fillStyle='#fff'; x.font=`700 ${Math.round(r*0.7)}px Inter`; x.textAlign='center'; x.textBaseline='middle'; x.fillText(ini,cx,cy+4); }

  };

  circulo(foto,W/2,cy,r,'#2b3550',iniciales((f.nombres||'')+' '+(f.apellidos||'')),!f.consentimiento_imagen);
  // etiqueta + nombre + equipo
  x.textAlign='center';

  const nomFig=((f.nombres||'')+' '+(f.apellidos||'')).toUpperCase();

  const nomL=L?nomEq(L).toUpperCase():'', nomV=V?nomEq(V).toUpperCase():'';

  circulo(escV,W/2+330,952,34,(V&&CLUBES[V.club_id]||{}).color||'#334155',iniciales((V&&CLUBES[V.club_id]||{}).nombre||'?'));
  x.textAlign='center'; x.fillStyle='#fff';
  const marc=`${nomL}  ${m.goles_local??''} : ${m.goles_visita??''}  ${nomV}`;
  x.font=fitText(marc,'46px "Bebas Neue"',540); x.fillText(marc,W/2,966);
  x.fillStyle='rgba(255,255,255,.4)'; x.font='600 22px Inter';
  x.fillText(`${m.etapa?m.etapa+' · ':''}${m.fecha||''}  ·  ⚡ Powered by Liguify · liguify.com/${MARCA.slug||''}`,W/2,1030);
  x.textAlign='left';
  window.__CVF=cv;
  cv.toBlob(async b=>{
    const file=new File([b],`figura-${(f.apellidos||'partido').toLowerCase().replace(/\s+/g,'-')}.png`,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:'Figura del partido'}); return; }catch(e){}
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=file.name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  },'image/png');
}
/* Llaves con plantilla (§13): etiqueta del cupo cuando el equipo aún no se define */
let PART_IDX={};
function etiquetaCupo(o){
  if(!o) return 'Por definir';
  if(o.t==='zona') return `${o.puesto}º ZONA ${o.zona}`;
  if(o.t==='mejor') return `${o.rank&&o.rank>1?o.rank+'º ':''}MEJOR ${o.puesto}º`;
  if(o.t==='ganador'||o.t==='perdedor'){
    const src=PART_IDX[o.partido];
    return (o.t==='ganador'?'GANADOR ':'PERDEDOR ')+(src?(src.etapa||''):'');
  }
  return 'Por definir';
}

/* liguify.com/<slug> abre esa marca directamente (es la dirección que se
   publica en los flyers y en el catálogo). Vercel sirve index.html para
   cualquier ruta de un segmento que no sea un archivo real. */
async function abrirPorRuta(){
  const slug=decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,'')).toLowerCase();
  if(slug==='scout') return scoutEntrada();
  await initScout();   // un scout logueado conserva su modo en cualquier ruta
  if(!slug) return irCatalogo();
  const {data}=await sb.from('marca').select('*').ilike('slug',slug).limit(1);
  if(data&&data.length){ MARCA=data[0]; return irMarca(); }
  history.replaceState(null,'','/');    // slug inexistente: catálogo, sin 404
  return irCatalogo();
}
async function irMarca(){
  if(!MARCA) return irCatalogo();
  err(null);
  if(MARCA.slug&&location.pathname.replace(/\//g,'')!==MARCA.slug) history.replaceState(null,'','/'+MARCA.slug);
  $('hdr-brand').textContent=MARCA.nombre.toUpperCase(); $('hdr-sub').textContent='Powered by Liguify';
  $('m-wm').textContent=iniciales(MARCA.nombre);
  $('m-meta').textContent=`${MARCA.ciudad?MARCA.ciudad.toUpperCase()+' · ':''}TEMPORADA 2026`;
  $('m-nombre').textContent=MARCA.nombre.toUpperCase();
  $('m-sub').textContent=`liguify.com/${MARCA.slug} · Powered by Liguify`;
  const {data:ts,error}=await sb.from('torneo').select('*').eq('marca_id',MARCA.id).order('created_at');
  if(error){err(error.message);return;}
  PUB_TORNEOS=ts||[]; PUB_VER_ANTERIORES=false;
  renderTorneosPub();
  show('s-torneos');
}
/* Público: solo EN CURSO por defecto; los finalizados quedan tras el botón
   "torneos anteriores". Borradores y archivados NUNCA se muestran. */
let PUB_TORNEOS=[], PUB_VER_ANTERIORES=false;
function renderTorneosPub(){
  const filaT=t=>`
    <button onclick='irTorneoId("${t.id}")' class="group relative overflow-hidden w-full bg-white border border-line rounded-2xl px-5 py-4 flex items-center gap-4 hover:border-brand-500/40 hover:shadow-md hover:-translate-y-0.5 transition text-left">
      <span class="w-11 h-11 rounded-xl grid place-items-center text-white font-display text-sm overflow-hidden relative shrink-0" style="background:#171e2e">${t.logo_url?`<img src="${t.logo_url}" class="absolute inset-0 w-full h-full object-cover"/>`:(t.nombre.replace(MARCA.nombre,'').trim().slice(0,4)||iniciales(t.nombre))}</span>
      <span class="flex-1 min-w-0">
        <span class="font-display text-xl tracking-wide block truncate">${t.nombre.toUpperCase()}</span>
        <span class="text-xs text-ink-400 font-semibold">Temporada ${t.anio} · ${t.estado==='en_curso'?'<b class="text-emerald-600">EN CURSO</b>':t.estado}</span>
      </span><span class="text-ink-400 group-hover:text-brand-600 transition">→</span>
      <span class="absolute -right-6 -bottom-6 w-16 h-16 rounded-full bg-brand-500/10 group-hover:bg-brand-500/20 transition"></span>
    </button>`;
  const enCurso=PUB_TORNEOS.filter(t=>t.estado==='en_curso');
  let anteriores=PUB_TORNEOS.filter(t=>t.estado==='finalizado');
  let principales=enCurso;
  // sin torneos en curso → se muestra el último finalizado como principal
  if(!enCurso.length&&anteriores.length){
    principales=[anteriores[anteriores.length-1]];
    anteriores=anteriores.slice(0,-1);
  }
  $('torneos').innerHTML=
    (principales.map(filaT).join('')||'<p class="text-ink-400 text-sm bg-white border border-line rounded-2xl px-5 py-4">Sin torneos publicados por el momento.</p>')
    +(anteriores.length?`
      <button onclick="PUB_VER_ANTERIORES=!PUB_VER_ANTERIORES;renderTorneosPub()" class="w-full text-left bg-paper border border-dashed border-line rounded-2xl px-5 py-3 text-xs font-bold text-ink-500 hover:bg-white">
        ${PUB_VER_ANTERIORES?'▾ OCULTAR':'▸ VER'} TORNEOS ANTERIORES (${anteriores.length})
      </button>
      ${PUB_VER_ANTERIORES?anteriores.map(filaT).join(''):''}`:'');
}

   (mezcla todas las categorías; al tocar un partido se entra a su categoría
   y se abre el detalle) ---- */
let TORNEO_CATS=[], TH_CN={};
async function renderHomeTorneo(cs){
  const el=$('t-home'); if(!el) return; el.innerHTML='';
  const catIds=cs.map(c=>c.id);
  TH_CN=Object.fromEntries(cs.map(c=>[c.id,(c.nombre_display||('Cat '+c.anio_nacimiento)).toUpperCase()]));
  const [ms,clsx]=await Promise.all([
    sb.from('partido').select('*, jornada:jornada_id(numero,horarios_publicados)').in('categoria_id',catIds).order('fecha').order('hora'),
    sb.from('club').select('*').eq('marca_id',MARCA.id)
  ]);
  (clsx.data||[]).forEach(c=>{CLUBES[c.id]=c;});
  const vis=(ms.data||[]).filter(m=>!(m.jornada&&m.jornada.horarios_publicados===false));
  const eqIds=[...new Set(vis.flatMap(m=>[m.local_id,m.visita_id]).filter(Boolean))];
  if(eqIds.length){const {data:eqs}=await sb.from('equipo').select('*').in('id',eqIds);(eqs||[]).forEach(e=>{EQUIPOS[e.id]=e;});}
  const vivo=vis.filter(m=>m.estado==='en_vivo');
  const hoy=new Date(Date.now()-5*3600e3).toISOString().slice(0,10);   // Perú UTC-5
  const prox=vis.filter(m=>m.estado==='programado'&&m.local_id&&m.visita_id&&m.fecha&&m.fecha>=hoy).slice(0,6);
  const fins=vis.filter(m=>['finalizado','walkover'].includes(m.estado))
    .sort((a,b)=>String(b.fecha||'').localeCompare(a.fecha||'')||String(b.hora||'').localeCompare(a.hora||'')).slice(0,6);
  const fmtF=f=>{const [y,mo,d]=f.split('-');return d+'/'+mo;};
  const tarjeta=m=>{
    const L=EQUIPOS[m.local_id],V=EQUIPOS[m.visita_id];
    const fin=['finalizado','walkover'].includes(m.estado), esVivo=m.estado==='en_vivo';
    const gL=fin&&(m.penales?(m.penales_local??0)>(m.penales_visita??0):m.goles_local>m.goles_visita);
    const gV=fin&&(m.penales?(m.penales_visita??0)>(m.penales_local??0):m.goles_visita>m.goles_local);
    const lado=(e,der)=>e?`<span class="flex items-center ${der?'':'justify-end'} gap-1.5 min-w-0">${der?badge(e,6)+' ':''}<span class="truncate text-xs font-semibold">${nomEq(e)}</span>${der?'':' '+badge(e,6)}</span>`:'<span class="text-xs italic text-ink-400">Por definir</span>';
    return `<div onclick="irPartidoHome('${m.categoria_id}','${m.id}')" class="bg-white border border-line rounded-2xl p-3 cursor-pointer hover:border-brand-500/40 hover:-translate-y-0.5 hover:shadow-md transition">
      <div class="mb-2 flex items-center justify-between gap-2 text-[10px] uppercase tracking-wider font-bold">
        <span class="rounded-md bg-paper border border-line px-1.5 py-0.5 text-ink-500 truncate">${TH_CN[m.categoria_id]||''}</span>
        ${esVivo?'<span class="flex items-center gap-1 text-brand-600 shrink-0"><span class="live-dot"></span>EN VIVO</span>'
          :fin?'<span class="text-emerald-600 shrink-0">FINAL</span>'
          :`<span class="text-ink-400 shrink-0">${m.fecha?fmtF(m.fecha):''}${m.hora?' · '+m.hora.slice(0,5):''}</span>`}
      </div>
      <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-2">
        ${lado(L,false)}
        <span class="font-display text-2xl leading-none text-center"><span class="${gL?'text-brand-600':''}">${m.goles_local??'–'}</span><span class="text-ink-400 mx-0.5">:</span><span class="${gV?'text-brand-600':''}">${m.goles_visita??'–'}</span></span>
        ${lado(V,true)}
      </div>
    </div>`;
  };
  const secc=(titulo,lista)=>lista.length?`<div class="mb-5">
    <h2 class="font-display text-2xl tracking-wide mb-2">${titulo}</h2>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${lista.map(tarjeta).join('')}</div>
  </div>`:'';
  el.innerHTML=secc('🔴 SE ESTÁ JUGANDO',vivo)+secc('📅 PRÓXIMOS PARTIDOS',prox)+secc('⚽ ÚLTIMOS RESULTADOS',fins);
}

/* ---- 🏆 TABLA GENERAL del torneo (config "Mostrar tabla general") ----

async function renderTablaGeneral(contId,torneo,cats){
  const el=document.getElementById(contId); if(!el) return;
  if(!torneo||!torneo.mostrar_tabla_general||!cats||!cats.length){el.innerHTML='';return;}
  const catIds=cats.map(c=>c.id);

  if(error||!filas||!filas.length){el.innerHTML='';return;}
  const eqIds=[...new Set(filas.map(f=>f.equipo_id))];
  const {data:eqs}=await sb.from('equipo').select('id,nombre,club_id').in('id',eqIds);
  const EQ=Object.fromEntries((eqs||[]).map(e=>[e.id,e]));
  const clubIds=[...new Set((eqs||[]).map(e=>e.club_id))];
  const {data:cls}=clubIds.length?await sb.from('club').select('id,nombre,escudo_url,color').in('id',clubIds):{data:[]};
  const CL=Object.fromEntries((cls||[]).map(c=>[c.id,c]));
  const norm=s=>String(s||'').toLowerCase().trim().replace(/\s+/g,' ');
  const acc={};
  filas.forEach(f=>{
    const e=EQ[f.equipo_id]||{}, cl=CL[e.club_id]||{};
    const key=(e.club_id||'?')+'|'+norm(e.nombre);
    const a=acc[key]=acc[key]||{nombre:e.nombre||cl.nombre||f.equipo,club:cl,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0,cats:new Set()};
    a.pj+=f.pj||0;a.pg+=f.pg||0;a.pe+=f.pe||0;a.pp+=f.pp||0;a.gf+=f.gf||0;a.gc+=f.gc||0;a.pts+=f.pts||0;a.cats.add(f.categoria_id);
  });
  const lista=Object.values(acc).map(a=>({...a,dg:a.gf-a.gc,ncat:a.cats.size}))
    .sort((a,b)=>b.pts-a.pts||b.dg-a.dg||b.gf-a.gf||a.pj-b.pj||a.nombre.localeCompare(b.nombre,'es'));
  const escudo=cl=>`<span class="inline-grid place-items-center w-7 h-7 rounded-lg text-white text-[10px] font-bold overflow-hidden relative shrink-0" style="background:${cl.escudo_url?'#fff':(cl.color||'#334155')}">${cl.escudo_url?`<img src="${cl.escudo_url}" class="absolute inset-0 w-full h-full object-contain"/>`:(cl.nombre||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</span>`;
  // en móvil solo #, equipo, PJ, DG y PTS (el resto aparece desde sm:)
  const th=(t,mov)=>`<th class="px-2 py-2 text-[10px] font-bold text-ink-400 text-center ${mov?'':'hidden sm:table-cell'}">${t}</th>`;
  const tdo=v=>`<td class="px-2 py-2 text-center hidden sm:table-cell">${v}</td>`;
  el.innerHTML=`<div class="bg-white border border-line rounded-2xl overflow-hidden mb-6">
    <div class="px-5 py-3 border-b border-line flex items-center justify-between flex-wrap gap-2">
      <span class="font-display text-xl tracking-wide">🏆 TABLA GENERAL</span>
      <span class="text-[10px] font-bold text-ink-400 uppercase tracking-wider">Acumulado de todas las categorías · ${lista.length} equipos</span>
    </div>
    <div class="overflow-x-auto"><table class="w-full text-sm">
      <thead><tr class="bg-paper"><th class="px-3 py-2 text-[10px] font-bold text-ink-400 text-left">#</th><th class="px-2 py-2 text-[10px] font-bold text-ink-400 text-left">EQUIPO</th>${th('PJ',1)}${th('PG')}${th('PE')}${th('PP')}${th('GF')}${th('GC')}${th('DG',1)}${th('PTS',1)}</tr></thead>
      <tbody>${lista.map((a,i)=>`<tr class="border-t border-line ${i<3?'bg-amber-50/40':''}">
        <td class="px-3 py-2 font-display text-base ${i<3?'text-brand-600':'text-ink-400'}">${i+1}</td>
        <td class="px-2 py-2"><span class="inline-flex items-center gap-2 font-bold">${escudo(a.club)}<span>${a.nombre}<span class="block text-[10px] text-ink-400 font-semibold">${a.ncat} categoría${a.ncat!==1?'s':''}</span></span></span></td>
        <td class="px-2 py-2 text-center">${a.pj}</td>${tdo(a.pg)}${tdo(a.pe)}${tdo(a.pp)}
        ${tdo(a.gf)}${tdo(a.gc)}<td class="px-2 py-2 text-center font-semibold">${a.dg>0?'+':''}${a.dg}</td>
        <td class="px-2 py-2 text-center font-display text-lg">${a.pts}</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="px-5 py-2 text-[10px] text-ink-400 border-t border-line">Suma de los resultados de cada equipo en todas las categorías del torneo. Orden: puntos, diferencia de gol, goles a favor.</p>
  </div>`;
}

function renderTabs(act){
  const TABS=[['tabla','Tabla','📊'],['fixture','Fixture','📅'],['llaves','Llaves','🏆'],['equipos','Equipos','🛡️']];
  $('c-tabs').innerHTML=TABS.map(([t,l])=>
    `<button onclick="renderTabs('${t}')" class="tabbtn ${t===act?'active':''} rounded-xl px-4 py-2 text-sm font-bold border border-line ${t===act?'':'text-ink-500 bg-white'}">${l}</button>`).join('');
  const mov=$('c-tabs-mov'); if(mov) mov.innerHTML=TABS.map(([t,l,ic])=>
    `<button onclick="renderTabs('${t}');window.scrollTo({top:0})" class="flex flex-col items-center gap-0.5 px-2 pt-2 pb-2.5 text-[10px] font-bold ${t===act?'text-brand-600':'text-ink-400'}">
      <span class="text-lg leading-none ${t===act?'':'grayscale opacity-70'}">${ic}</span>${l}</button>`).join('');
  document.querySelectorAll('.ctab').forEach(x=>x.classList.add('hidden'));
  $('tab-'+act).classList.remove('hidden');
}

/* 🏅 Ranking de la categoría (POR TORNEO): pestañas TODOS / ARQ / DEF / MED / DEL,
   top 10 con link a top 50. El # es el puesto en la categoría (o en su línea). */

  const tabs=`<div class="flex flex-wrap gap-1.5 px-4 py-2.5 border-b border-line bg-paper/60">${TABS.map(([v,l])=>
    `<button onclick="RK_LINEA=${v?`'${v}'`:'null'};RK_LIM=10;${renderFn}()" class="text-[10px] font-bold rounded-lg px-2.5 py-1.5 border transition ${RK_LINEA===v?'bg-ink-900 text-white border-ink-900':'bg-white border-line text-ink-500 hover:bg-paper'}">${l}</button>`).join('')}</div>`;

      <span class="font-display text-xl tracking-wide">🏅 RANKING</span>

    ${tabs}
    ${filas.length?`<div class="overflow-x-auto"><table class="w-full sm:min-w-[480px]">
      <thead><tr class="text-[10px] uppercase text-ink-400 border-b border-line tracking-wider">
        <th class="py-2 w-8">#</th><th class="text-left">Jugador</th><th class="w-16">Puntos</th><th class="w-16">Torneo</th></tr></thead>
      <tbody>${filas.map((g,i)=>`<tr ${g.perfil_token?`onclick="window.open('/jugador/${g.perfil_token}','_blank')" title="Ver el perfil del jugador"`:''} class="border-b border-line last:border-0 ${i===0?'bg-amber-50/60':''} ${g.perfil_token?'cursor-pointer hover:bg-paper transition':''}">
        <td class="py-2 pl-2 text-center font-bold text-sm ${i<3?'text-brand-600':'text-ink-400'}">${g.puesto}</td>
        <td><span class="flex items-center gap-2.5 py-1">
          <span class="w-9 h-9 rounded-full grid place-items-center text-[10px] font-bold text-white overflow-hidden relative shrink-0" style="background:#2b3550${g.consentimiento?'':';filter:grayscale(1);opacity:.85'}">${g.foto_url?`<img src="${g.foto_url}" class="absolute inset-0 w-full h-full object-cover"/>`:iniciales((g.nombres||'')+' '+(g.apellidos||''))}</span>
          <span class="min-w-0"><span class="font-semibold text-sm block truncate">${g.nombres} ${g.apellidos}${i===0?' <span class="text-amber-600">👑</span>':''}</span>
          <span class="text-[10px] text-ink-400 block truncate">${g.equipo||''}${!RK_LINEA&&g.linea?' · '+({ARQ:'Arquero',DEF:'Defensa',MED:'Mediocampista',DEL:'Delantero'})[g.linea]:''}</span></span>
          ${SCOUT&&g.jugador_id?`<button data-jid="${g.jugador_id}" onclick="event.stopPropagation();toggleSeguir('${g.jugador_id}')" class="${btnSeguirCls(SEG_SET.has(g.jugador_id))} ml-auto mr-2">${SEG_SET.has(g.jugador_id)?'✔ SIGUIENDO':'➕ SEGUIR'}</button>`:''}</span></td>
        <td class="text-center font-display text-xl">${g.puntos}</td>

      :'<p class="px-4 py-6 text-xs text-ink-400 text-center">Sin jugadores con puntos en esta línea (según la posición registrada en la LBF).</p>'}
    ${d.total>10?`<div class="px-4 py-2.5 border-t border-line text-center">
      <button onclick="RK_LIM=RK_LIM===10?50:10;${renderFn}()" class="text-xs font-bold text-brand-600 hover:underline">${RK_LIM===10?'VER LOS 50 PRIMEROS ↓':'VER SOLO EL TOP 10 ↑'}</button></div>`:''}
    <p class="px-4 py-2 text-[10px] text-ink-400 border-t border-line">Ranking del torneo. Puntos por partidos jugados, goles, asistencias, figura del partido y equipo ideal según la posición del jugador; las tarjetas restan. # = puesto en ${RK_LINEA?'su línea dentro de la categoría':'la categoría'} · TORNEO = puesto en todo el torneo.</p>

let TABLA_MODO='zonas';
function setTablaModo(m){ TABLA_MODO=m; renderTabla(); }
async function renderTabla(){
  const {data,error}=await sb.from('vista_tabla_zona').select('*').eq('categoria_id',CAT.id);
  if(error){$('tab-tabla').innerHTML='';err(error.message);return;}
  const orden=(TORNEO.orden_tabla&&TORNEO.orden_tabla.length?TORNEO.orden_tabla:['PJ','PUNTOS','DIF_GOL','GF','GC']).filter(k=>COLDEF[k]);
  const criterios=orden.filter(k=>k!=='PJ');   // PJ es informativa
  const cmp=(a,b)=>{ for(const k of criterios){ const f=COLDEF[k].f; const d=(k==='GC')?(a[f]-b[f]):(b[f]-a[f]); if(d) return d; } return String(a.equipo).localeCompare(b.equipo); };
  const zonas=[...new Set(data.map(r=>r.zona))].sort();
  // en móvil solo PJ, DG y PTS; el resto de columnas aparece desde sm:
  const OCULTA_MOVIL={PG:1,PE:1,PP:1,GF:1,GC:1};
  const thz=k=>`<th class="w-10 ${OCULTA_MOVIL[k]?'hidden sm:table-cell':''}">${COLDEF[k].h}</th>`;
  const celdas=r=>orden.map(k=>{const v=r[COLDEF[k].f];return `<td class="text-center text-sm ${OCULTA_MOVIL[k]?'hidden sm:table-cell ':''}${k==='PUNTOS'?'font-extrabold':k==='DIF_GOL'?(v>0?'text-emerald-600 font-semibold':v<0?'text-brand-600 font-semibold':'text-ink-400'):'text-ink-400'}">${k==='DIF_GOL'&&v>0?'+':''}${v}</td>`;}).join('');
  const toggle=zonas.length>1?`<div class="flex gap-2 mb-3">
    ${[['zonas','POR ZONA'],['puestos','⚖ MEJORES POR PUESTO']].map(([m,l])=>`<button onclick="setTablaModo('${m}')" class="text-xs font-bold px-4 py-2 rounded-xl border ${TABLA_MODO===m?'bg-ink-900 text-white border-ink-900':'bg-white border-line text-ink-500 hover:bg-paper'}">${l}</button>`).join('')}
  </div>`:'';
  const golHTML=await goleadoresHTML(CAT.id);
  const rkHTML=await rankingHTML(CAT.id,'renderTabla');
  const ultHTML=await ultimosResultadosHTML();
  if(TABLA_MODO==='puestos'&&zonas.length>1){
    const porPuesto={};
    zonas.forEach(z=>{data.filter(r=>r.zona===z).sort(cmp).forEach((r,i)=>{(porPuesto[i+1]=porPuesto[i+1]||[]).push({...r,_zona:z});});});
    const ORD={1:'PRIMEROS',2:'SEGUNDOS',3:'TERCEROS',4:'CUARTOS',5:'QUINTOS',6:'SEXTOS',7:'SÉPTIMOS',8:'OCTAVOS'};
    $('tab-tabla').innerHTML=toggle+
      Object.keys(porPuesto).map(Number).sort((a,b)=>a-b).map(p=>{
        const rows=porPuesto[p].sort(cmp);
        return `<div class="bg-white rounded-2xl border border-line mb-4 overflow-x-auto">
          <div class="px-4 py-3 border-b border-line font-display text-xl tracking-wide">${ORD[p]||p+'°'} DE CADA ZONA</div>
          <table class="w-full sm:min-w-[520px]">
            <thead><tr class="text-[10px] uppercase text-ink-400 border-b border-line tracking-wider">
              <th class="py-2 w-8"></th><th class="text-left">Equipo</th><th class="w-14">Zona</th>
              ${orden.map(thz).join('')}
            </tr></thead>
            <tbody>${rows.map((r,i)=>`<tr class="border-b border-line last:border-0 ${i===0?'bg-emerald-50/60':'hover:bg-paper'}">
              <td class="py-2.5 pl-2 text-ink-400 font-bold text-center">${i+1}</td>
              <td><button onclick='irEquipoId("${r.equipo_id}")' class="flex items-center gap-2.5 font-semibold text-sm hover:text-brand-600">${EQUIPOS[r.equipo_id]?badge(EQUIPOS[r.equipo_id]):''}<span>${r.equipo}</span>${i===0?'<span class="text-[9px] font-bold bg-emerald-100 text-emerald-700 rounded px-1.5 py-0.5">MEJOR</span>':''}</button></td>
              <td class="text-center text-xs font-bold text-ink-500">${r._zona}</td>
              ${celdas(r)}
            </tr>`).join('')}</tbody></table></div>`;
      }).join('')+ultHTML+golHTML+rkHTML;
    return;
  }
  $('tab-tabla').innerHTML=toggle+zonas.map(z=>{
    const rows=data.filter(r=>r.zona===z).sort(cmp);
    return `<div class="bg-white rounded-2xl border border-line mb-4 overflow-x-auto">
      <div class="px-4 py-3 border-b border-line font-display text-xl tracking-wide">ZONA ${z}</div>
      <table class="w-full sm:min-w-[480px]">
        <thead><tr class="text-[10px] uppercase text-ink-400 border-b border-line tracking-wider">
          <th class="py-2 w-8"></th><th class="text-left">Equipo</th>
          ${orden.map(thz).join('')}
        </tr></thead>
        <tbody>${rows.map((r,i)=>`<tr class="border-b border-line last:border-0 hover:bg-paper">
          <td class="py-2.5 pl-2 text-ink-400 font-bold text-center">${i+1}</td>
          <td><button onclick='irEquipoId("${r.equipo_id}")' class="flex items-center gap-2.5 font-semibold text-sm hover:text-brand-600">${EQUIPOS[r.equipo_id]?badge(EQUIPOS[r.equipo_id]):''}<span>${r.equipo}</span></button></td>
          ${celdas(r)}
        </tr>`).join('')}</tbody></table></div>`;
  }).join('')+ultHTML+golHTML+rkHTML || '<p class="text-ink-400 text-sm">Sin equipos en zonas todavía.</p>';
}

/* Fixture: partidos agrupados por jornada, desde la BD */
async function renderFixture(){
  const {data,error}=await sb.from('partido')
    .select('*, jornada:jornada_id(numero,nombre,horarios_publicados), zona:zona_id(nombre)')
    .eq('categoria_id',CAT.id).order('fecha').order('hora');
  if(error){$('tab-fixture').innerHTML='';err(error.message);return;}
  await cargarPlanillas(data.filter(m=>['finalizado','walkover'].includes(m.estado)).map(m=>m.id));   // goles y tarjetas bajo el marcador
  const grupos={};
  data.forEach(m=>{ PART_IDX[m.id]=m;
    if(m.jornada&&m.jornada.horarios_publicados===false) return;   // fecha OCULTA: no se muestra en el público
    const k=m.etapa||('FECHA '+((m.jornada&&m.jornada.numero)||'?')); (grupos[k]=grupos[k]||[]).push(m); });
  $('tab-fixture').innerHTML=Object.entries(grupos).map(([g,ms])=>`
    <div class="bg-white rounded-2xl border border-line mb-4">
      <div class="px-4 py-2.5 border-b border-line font-display text-lg tracking-wide">${g.toUpperCase()}</div>
      ${ms.map(filaPartidoPublico).join('')}
    </div>`).join('') || '<p class="text-ink-400 text-sm">Sin partidos programados.</p>';
}
/* Fila de partido (la usan el Fixture y los Últimos resultados de la Tabla) */
/* Goles y tarjetas por partido (planilla pública) para mostrarlos bajo el marcador
   sin entrar al detalle: ⚽ Nombre Apellido ×2 · 🟨 · 🟥, alineados con su equipo */
let PLAN_IDX={};
async function cargarPlanillas(ids){
  ids=(ids||[]).filter(id=>id&&!(id in PLAN_IDX));
  if(!ids.length) return;
  const {data}=await sb.from('vista_planilla_publica').select('partido_id,equipo_id,nombres,apellidos,goles,amarillas,rojas')
    .in('partido_id',ids).or('goles.gt.0,amarillas.gt.0,rojas.gt.0');
  ids.forEach(id=>{PLAN_IDX[id]=[];});
  (data||[]).forEach(r=>{(PLAN_IDX[r.partido_id]=PLAN_IDX[r.partido_id]||[]).push(r);});
}
function eventosHTML(m){
  const rows=PLAN_IDX[m.id]; if(!rows||!rows.length) return '';
  const nom=r=>(((r.nombres||'').trim().split(/\s+/)[0]||'')+' '+((r.apellidos||'').trim().split(/\s+/)[0]||'')).trim();
  const lado=eqId=>rows.filter(r=>r.equipo_id===eqId).flatMap(r=>{const o=[];
    if(r.goles>0) o.push(`<span class="block whitespace-nowrap">⚽ ${nom(r)}${r.goles>1?' <b>×'+r.goles+'</b>':''}</span>`);
    if(r.amarillas>0) o.push(`<span class="block whitespace-nowrap">🟨 ${nom(r)}${r.amarillas>1?' ×'+r.amarillas:''}</span>`);
    if(r.rojas>0) o.push(`<span class="block whitespace-nowrap">🟥 ${nom(r)}</span>`);
    return o;}).join('');
  const L=lado(m.local_id), V=lado(m.visita_id);
  if(!L&&!V) return '';
  return `<div class="flex gap-1 sm:gap-2 mt-1 text-[10px] text-ink-500 font-semibold">
    <div class="flex-1 min-w-0 text-right">${L}</div><div class="w-24 sm:w-28 shrink-0"></div><div class="flex-1 min-w-0 text-left">${V}</div></div>`;
}
function filaPartidoPublico(m){
  const fin=m.estado==='finalizado'||m.estado==='walkover', vivo=m.estado==='en_vivo';
  const L=EQUIPOS[m.local_id], V=EQUIPOS[m.visita_id];
  const lado=(e,ori,der)=>e
    ?(der?`${badge(e)} ${nomEq(e)}`:`${nomEq(e)} ${badge(e)}`)
    :`<span class="italic text-ink-400">${etiquetaCupo(ori)}</span>`;
  const gL=fin&&(m.penales?(m.penales_local??0)>(m.penales_visita??0):m.goles_local>m.goles_visita);
  const gV=fin&&(m.penales?(m.penales_visita??0)>(m.penales_local??0):m.goles_visita>m.goles_local);
  const est=vivo?`<span class="flex items-center justify-center gap-1 text-[9px] font-bold text-brand-600"><span class="live-dot"></span>EN VIVO</span>`
    :`<span class="block text-[9px] font-bold uppercase tracking-wider ${fin?'text-emerald-600':'text-ink-400'}">${(!m.local_id||!m.visita_id)?'por definir':(m.estado==='finalizado'?'final':m.estado==='walkover'?'w.o.':m.estado)}</span>`;
  return `<div onclick="abrirDetallePartido('${m.id}')" class="px-3 sm:px-4 py-3 border-b border-line last:border-0 cursor-pointer hover:bg-paper transition" title="Ver detalle del partido">
    <div class="flex items-center gap-1 sm:gap-2">
      <div class="flex-1 min-w-0 flex items-center justify-end gap-1.5 sm:gap-2 text-xs sm:text-sm ${gL?'font-bold':''}">${lado(L,m.local_origen,false)}</div>
      <div class="w-24 sm:w-28 text-center shrink-0">
        ${est}
        <span class="font-display text-3xl leading-none"><span class="${gL?'text-brand-600':''}">${m.goles_local??'–'}</span><span class="text-ink-400 mx-1">:</span><span class="${gV?'text-brand-600':''}">${m.goles_visita??'–'}</span></span>
        ${m.penales?`<span class="block text-[11px] text-ink-400 mt-0.5">penales ${m.penales_local} x ${m.penales_visita}</span>`:''}
      </div>
      <div class="flex-1 min-w-0 flex items-center gap-1.5 sm:gap-2 text-xs sm:text-sm ${gV?'font-bold':''}">${lado(V,m.visita_origen,true)}</div>
    </div>
    ${eventosHTML(m)}
    <p class="text-[11px] font-semibold text-ink-500 text-center mt-1.5">${(m.jornada&&m.jornada.horarios_publicados===false)?'🕒 Horario por confirmar':`📅 ${m.fecha||'Día por definir'}  ·  🕒 ${m.hora?m.hora.slice(0,5):'--:--'}${m.sede?'  ·  📍 '+m.sede:''}`}</p>
    ${m.video_url?videoPill(m.video_url):''}
  </div>`;
}
/* ÚLTIMOS RESULTADOS (pestaña Tabla): la última fecha jugada o en juego.
   Se elige la jornada visible de mayor número que tenga algún partido
   finalizado/walkover/en vivo, y se muestran TODOS sus partidos. */
async function ultimosResultadosHTML(){
  const {data}=await sb.from('partido')
    .select('*, jornada:jornada_id(numero,nombre,horarios_publicados)')
    .eq('categoria_id',CAT.id).not('jornada_id','is',null).order('fecha').order('hora');
  const vis=(data||[]).filter(m=>!(m.jornada&&m.jornada.horarios_publicados===false));
  const jugados=vis.filter(m=>['finalizado','walkover','en_vivo'].includes(m.estado));
  if(!jugados.length) return '';
  const num=Math.max(...jugados.map(m=>(m.jornada&&m.jornada.numero)||0));
  const ms=vis.filter(m=>((m.jornada&&m.jornada.numero)||0)===num);
  ms.forEach(m=>{PART_IDX[m.id]=m;});
  await cargarPlanillas(ms.filter(m=>['finalizado','walkover'].includes(m.estado)).map(m=>m.id));
  const enVivo=ms.some(m=>m.estado==='en_vivo');
  return `<div class="bg-white rounded-2xl border border-line mb-4">
    <div class="px-4 py-2.5 border-b border-line flex items-center justify-between flex-wrap gap-2">
      <span class="font-display text-lg tracking-wide">${enVivo?'🔴 SE ESTÁ JUGANDO':'⚽ ÚLTIMOS RESULTADOS'} · FECHA ${num}</span>
      <button onclick="renderTabs('fixture')" class="text-[11px] font-bold text-brand-600 hover:underline">Ver fixture completo →</button>
    </div>
    ${ms.map(filaPartidoPublico).join('')}
  </div>`;
}

/* Llaves: bracket de la fase eliminatoria (no suma puntos a grupos) */
const ORDEN_ETAPAS=['Octavos','Cuartos de final','Semifinal','Tercer puesto','Final'];
function cardLlave(m){
  const fin=['finalizado','walkover'].includes(m.estado), vivo=m.estado==='en_vivo';
  const marc=id=>(fin||vivo)?(id===m.local_id?m.goles_local:m.goles_visita):'–';
  const pen=id=>m.penales?`<span class="text-[10px] text-ink-400 ml-1">(${id===m.local_id?m.penales_local:m.penales_visita})</span>`:'';
  const gana=id=>fin&&(m.penales
    ?(id===m.local_id?m.penales_local>m.penales_visita:m.penales_visita>m.penales_local)
    :(id===m.local_id?m.goles_local>m.goles_visita:m.goles_visita>m.goles_local));
  return `<div onclick="abrirDetallePartido('${m.id}')" class="bg-white border border-line rounded-2xl p-4 hover:shadow-md transition cursor-pointer" title="Ver detalle del partido">
    <p class="text-[10px] font-bold uppercase tracking-wider ${vivo?'text-brand-600':'text-ink-400'} mb-2">
      ${vivo?'<span class="live-dot inline-block align-middle mr-1"></span>EN VIVO · ':''}🏆 ${m.etapa}
      ${m.fecha?` · ${m.fecha}`:''}${m.hora?` ${m.hora.slice(0,5)}`:''}
    </p>
    ${[[m.local_id,m.local_origen],[m.visita_id,m.visita_origen]].map(([id,ori])=>{const e=EQUIPOS[id];return `
      <div class="flex items-center gap-2 py-1.5 ${id&&gana(id)?'font-bold':''}">
        ${e?badge(e):'<span class="inline-block w-7 h-7 rounded-lg bg-paper border border-dashed border-line shrink-0"></span>'}
        <span class="text-sm flex-1 ${e?'':'italic text-ink-400'}">${e?nomEq(e):etiquetaCupo(ori)}</span>
        <span class="font-display text-xl">${id?(marc(id)??'–'):'–'}</span>${id?pen(id):''}
      </div>`;}).join('')}
    ${m.penales?'<p class="text-[10px] text-ink-400 mt-1">definición por penales</p>':''}
    ${m.sede?`<p class="text-[10px] text-ink-400 mt-1">📍 ${m.sede}</p>`:''}
  </div>`;
}
async function renderLlaves(){
  const {data,error}=await sb.from('partido').select('*, fase:fase_id(nombre)')
    .eq('categoria_id',CAT.id).not('etapa','is',null).order('etapa');
  if(error){$('tab-llaves').innerHTML='';return;}
  (data||[]).forEach(m=>PART_IDX[m.id]=m);   // para etiquetas "GANADOR Semifinal #1"
  if(!(data||[]).length){
    $('tab-llaves').innerHTML='<p class="text-ink-400 text-sm bg-white border border-line rounded-2xl p-6 text-center">La fase eliminatoria aún no está programada.</p>';
    return;
  }
  // SECCIONES por fase (ORO / PLATA / …) y dentro, columnas por etapa
  const porFase={};
  data.forEach(m=>{const f=(m.fase&&m.fase.nombre)||'Eliminatoria';(porFase[f]=porFase[f]||[]).push(m);});
  const medalla=n=>/oro/i.test(n)?'🥇':/plata/i.test(n)?'🥈':/bronce/i.test(n)?'🥉':'🏆';
  $('tab-llaves').innerHTML=`
    <p class="text-ink-500 text-sm mb-4">Fase eliminatoria — los resultados de las llaves no suman puntos a la tabla de grupos.</p>`+
    Object.entries(porFase).map(([faseNom,ms])=>{
      const grupos={};
      ms.forEach(m=>{const k=(m.etapa||'').split(' #')[0];(grupos[k]=grupos[k]||[]).push(m);});
      const etapas=Object.keys(grupos).sort((a,b)=>{
        const ia=ORDEN_ETAPAS.indexOf(a), ib=ORDEN_ETAPAS.indexOf(b);
        return (ia<0?99:ia)-(ib<0?99:ib);
      });
      return `<div class="mb-8">
        <div class="bg-ink-900 text-white rounded-2xl px-5 py-3 mb-4 flex items-center gap-2">
          <span class="text-xl">${medalla(faseNom)}</span>
          <span class="font-display text-2xl tracking-wide">${faseNom.toUpperCase()}</span>
        </div>
        <div class="grid gap-4 items-start" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
          ${etapas.map(et=>`<div>
            <p class="font-display text-xl tracking-wide mb-2 ${et==='Final'?'text-amber-600':''}">${et.toUpperCase()}</p>
            <div class="space-y-3">${grupos[et].map(cardLlave).join('')}</div>
          </div>`).join('')}
        </div>
      </div>`;
    }).join('');
}

/* Equipos de la categoría */
async function renderEquipos(){
  $('tab-equipos').innerHTML=`<div class="grid sm:grid-cols-2 gap-3">${Object.values(EQUIPOS).map(e=>`
    <button onclick='irEquipoId("${e.id}")' class="bg-white border border-line rounded-2xl p-4 flex items-center gap-3 hover:shadow-md transition text-left">
      ${badge(e,9)}
      <span class="flex-1"><span class="font-bold text-sm block">${nomEq(e)}</span>
      <span class="text-xs text-ink-400">${(CLUBES[e.club_id]||{}).nombre||''}</span></span>
      <span class="text-ink-400">→</span>
    </button>`).join('')}</div>`;
}

/* ============ EQUIPO: LBF pública ============ */
async function irEquipoId(id){
  EQUIPO=EQUIPOS[id]; if(!EQUIPO) return;
  err(null);
  $('bc-cat').textContent='← '+(CAT.nombre_display||'Categoría');
  $('eq-head').innerHTML=`<div class="bg-ink-900 text-white rounded-2xl p-5 sm:p-6 flex items-center gap-4 relative overflow-hidden">
    <div class="absolute inset-0 opacity-25" style="background:radial-gradient(circle at 85% 15%, #d9232e 0%, transparent 55%)"></div>
    <div class="relative flex items-center gap-4 min-w-0">
      ${badge(EQUIPO,9)}
      <div class="min-w-0"><h1 class="font-display text-3xl sm:text-4xl tracking-wide truncate">${nomEq(EQUIPO).toUpperCase()}</h1>
      <p class="text-white/50 text-xs sm:text-sm truncate">${(CLUBES[EQUIPO.club_id]||{}).nombre||''} · ${TORNEO.nombre}</p></div>
    </div>
  </div>`;
  // Partidos del equipo: resultados y programados (mockup: ficha completa)
  const {data:pms}=await sb.from('partido')
    .select('*, jornada:jornada_id(numero,horarios_publicados)')
    .eq('categoria_id',CAT.id)
    .or(`local_id.eq.${id},visita_id.eq.${id}`)
    .order('fecha').order('hora');
  (pms||[]).forEach(m=>PART_IDX[m.id]=m);   // para el detalle del partido
  await cargarPlanillas((pms||[]).filter(m=>['finalizado','walkover'].includes(m.estado)).map(m=>m.id));   // goles y tarjetas bajo el marcador
  const filaP=m=>{
    const fin=['finalizado','walkover'].includes(m.estado), vivo=m.estado==='en_vivo';
    const L=EQUIPOS[m.local_id], V=EQUIPOS[m.visita_id];
    const ctx=m.etapa?`🏆 ${m.etapa}`:(m.jornada&&m.jornada.numero?`Fecha ${m.jornada.numero}`:'');
    const lado=(e,ori,der)=>e
      ?(der?`${badge(e)} ${nomEq(e)}`:`${nomEq(e)} ${badge(e)}`)
      :`<span class="italic text-ink-400">${etiquetaCupo(ori)}</span>`;
    const gL=fin&&(m.penales?(m.penales_local??0)>(m.penales_visita??0):m.goles_local>m.goles_visita);
    const gV=fin&&(m.penales?(m.penales_visita??0)>(m.penales_local??0):m.goles_visita>m.goles_local);
    return `<div onclick="abrirDetallePartido('${m.id}')" class="px-4 pt-3 border-b border-line last:border-0 cursor-pointer hover:bg-paper" title="Ver detalle del partido">
      <div class="flex items-center gap-1 sm:gap-2">
        <div class="flex-1 min-w-0 flex items-center justify-end gap-1.5 sm:gap-2 text-xs sm:text-sm ${gL?'font-bold':''}">${lado(L,m.local_origen,false)}</div>
        <div class="w-24 sm:w-28 text-center shrink-0">
          ${vivo?`<span class="flex items-center justify-center gap-1 text-[9px] font-bold text-brand-600"><span class="live-dot"></span>EN VIVO</span>`
            :`<span class="block text-[9px] font-bold uppercase tracking-wider ${fin?'text-emerald-600':'text-ink-400'}">${fin?(m.estado==='walkover'?'w.o.':'final'):m.estado}</span>`}
          <span class="font-display text-3xl leading-none"><span class="${gL?'text-brand-600':''}">${m.goles_local??'–'}</span><span class="text-ink-400 mx-1">:</span><span class="${gV?'text-brand-600':''}">${m.goles_visita??'–'}</span></span>
          ${m.penales?`<span class="block text-[11px] text-ink-400 mt-0.5">penales ${m.penales_local} x ${m.penales_visita}</span>`:''}
        </div>
        <div class="flex-1 min-w-0 flex items-center gap-1.5 sm:gap-2 text-xs sm:text-sm ${gV?'font-bold':''}">${lado(V,m.visita_origen,true)}</div>
      </div>
      ${eventosHTML(m)}
      <p class="text-[10px] text-ink-400 text-center ${m.video_url?'':'pb-2'}">${ctx}${(m.jornada&&m.jornada.horarios_publicados===false)?' · 🕒 horario por confirmar':`${m.fecha?' · '+m.fecha:''}${m.hora?' '+m.hora.slice(0,5):''}${m.sede?' · '+m.sede:''}`}</p>
      ${m.video_url?`<div class="pb-2">${videoPill(m.video_url)}</div>`:''}
    </div>`;
  };
  const visibles=(pms||[]).filter(m=>!(m.jornada&&m.jornada.horarios_publicados===false));  // fechas OCULTAS no se muestran
  const jugados=visibles.filter(m=>['finalizado','walkover'].includes(m.estado));
  const proximos=visibles.filter(m=>!['finalizado','walkover'].includes(m.estado));
  $('eq-partidos').innerHTML=visibles.length?`
    ${proximos.length?`<div class="bg-white rounded-2xl border border-line mt-4 overflow-hidden">
      <p class="px-5 py-3 border-b border-line font-display text-xl tracking-wide">PRÓXIMOS PARTIDOS</p>
      ${proximos.map(filaP).join('')}
    </div>`:''}
    ${jugados.length?`<div class="bg-white rounded-2xl border border-line mt-4 overflow-hidden">
      <p class="px-5 py-3 border-b border-line font-display text-xl tracking-wide">RESULTADOS</p>
      ${jugados.map(filaP).join('')}
    </div>`:''}`:'';
  // 🔭 scout: estadísticas completas del equipo (también dan el jugador_id
  // de cada inscripción para el botón SEGUIR de la LBF)
  let SCST=[]; const J_INS={};
  if(SCOUT){
    const q=await sb.rpc('stats_equipo_scout',{p_equipo:id});
    SCST=(q.data||[]).sort((a,b)=>ordCamiseta(a,b,(a.nombres||'')+' '+(a.apellidos||''),(b.nombres||'')+' '+(b.apellidos||'')));
    SCST.forEach(s=>{J_INS[s.inscripcion_id]=s.jugador_id;});
  }
  $('eq-stats').innerHTML=SCOUT?statsScoutHTML(SCST):'';
  const {data,error}=await sb.from('vista_lbf_publica').select('*').eq('equipo_id',id).order('dorsal');
  if(error){err(error.message);return;}
  data.sort((a,b)=>ordCamiseta(a,b,(a.nombres||'')+' '+(a.apellidos||''),(b.nombres||'')+' '+(b.apellidos||'')));
  $('eq-lbf').innerHTML=data.length?data.map(j=>`
    <div class="flex items-center gap-3 px-5 py-2.5 border-b border-line last:border-0">
      <span class="w-9 h-9 rounded-full grid place-items-center text-[11px] font-bold text-white overflow-hidden relative" style="background:#2b3550;${j.consentimiento_imagen?'':'filter:grayscale(1);opacity:.75'}">
        ${j.foto_url?`<img src="${j.foto_url}" class="absolute inset-0 w-full h-full object-cover"/>`:iniciales(j.nombres+' '+j.apellidos)}
      </span>
      <span class="w-6 text-ink-400 font-bold text-sm">${j.dorsal??''}</span>
      <span class="flex-1 font-semibold text-sm">${j.nombres} ${j.apellidos} ${j.capitan?'<span class="text-[9px] bg-ink-900 text-white rounded px-1.5 py-0.5 ml-1 font-bold">C</span>':''}
        ${(j.posicion||j.pie_habil)?`<span class="block text-[10px] text-ink-400 font-normal">${[j.posicion,j.pie_habil].filter(Boolean).join(' · ')}</span>`:''}</span>
      <span class="text-xs text-ink-400">nac. ${j.mes_nacimiento?String(j.mes_nacimiento).padStart(2,'0')+'/':''}${j.anio_nacimiento}</span>
      ${j.perfil_token?`<a href="/jugador/${j.perfil_token}" target="_blank" rel="noopener" title="${j.perfil_activo?'Perfil activo (administrado por su familia)':'Perfil disponible — su familia aún no lo administra'}" class="shrink-0 inline-flex items-center gap-1 ${j.perfil_activo?'bg-amber-400 hover:bg-amber-500 text-ink-900':'bg-ink-400/20 hover:bg-ink-400/30 text-ink-500'} text-[10px] font-bold rounded-full px-2.5 py-1">⭐ PERFIL</a>`:''}
      ${SCOUT&&J_INS[j.inscripcion_id]?`<button data-jid="${J_INS[j.inscripcion_id]}" onclick="toggleSeguir('${J_INS[j.inscripcion_id]}')" class="${btnSeguirCls(SEG_SET.has(J_INS[j.inscripcion_id]))}">${SEG_SET.has(J_INS[j.inscripcion_id])?'✔ SIGUIENDO':'➕ SEGUIR'}</button>`:''}
    </div>`).join(''):'<p class="px-5 py-8 text-sm text-ink-400 text-center">Este equipo aún no publica su plantel.</p>';
  show('s-equipo');
}

/* ============ REALTIME: la página se actualiza sola ============ */
sb.channel('publico-live')
  .on('postgres_changes',{event:'*',schema:'competencias',table:'partido'},async ()=>{
    $('hdr-rt').innerHTML='<span class="live-dot"></span> actualizado en vivo';
    setTimeout(()=>$('hdr-rt').innerHTML='',4000);
    if($('s-categoria').classList.contains('active')){ await renderTabla(); await renderFixture(); await renderLlaves(); }
  })
  .subscribe(st=>{ if(st==='SUBSCRIBED') $('hdr-rt').innerHTML=''; });

abrirPorRuta();
</script>
