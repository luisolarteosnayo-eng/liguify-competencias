<main class="max-w-5xl mx-auto px-4 py-6">

<script>
const sb = supabase.createClient(
  'https://bpsczjjomgzhnjxnzmhj.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwc2N6ampvbWd6aG5qeG56bWhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MDg5MTgsImV4cCI6MjA5ODA4NDkxOH0.3O92Q-3xxdCmF1LStCQrlCtz1s_EfdlayXnL_mEElOw',

const $=id=>document.getElementById(id);
let MARCA=null, TORNEO=null, CAT=null, EQUIPO=null;
let EQUIPOS={}, CLUBES={};

function err(msg){ const e=$('err'); if(!msg){e.classList.add('hidden');return;} e.textContent='⚠ '+msg; e.classList.remove('hidden'); }
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=$(id); el.classList.add('active','fade'); setTimeout(()=>el.classList.remove('fade'),240);
  window.scrollTo({top:0,behavior:'smooth'});
}
const iniciales=n=>(n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
/* Pastilla "VER VIDEO" clicable desde la lista (no abre el detalle del partido) */
const videoPill=u=>`<div class="flex justify-center mt-1.5"><a href="${u}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Ver el video del partido"
  class="inline-flex items-center gap-1.5 text-[10px] font-bold text-white rounded-full pl-1.5 pr-3 py-1 shadow-md hover:shadow-lg hover:scale-105 transition" style="background:linear-gradient(135deg,#ef4444,#b91c1c)">
  <span class="grid place-items-center w-4 h-4 bg-white rounded-full shrink-0"><span style="width:0;height:0;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;border-left:6px solid #b91c1c;margin-left:1.5px"></span></span>VER VIDEO</a></div>`;
function badge(eq,sz=7){
  const cl=CLUBES[eq.club_id]||{};
  return `<span class="relative inline-grid place-items-center w-${sz} h-${sz} rounded-lg text-white text-[10px] font-bold shrink-0 overflow-hidden align-middle" style="background:${cl.escudo_url?'#fff':(cl.color||'#334155')}">${cl.escudo_url?`<img src="${cl.escudo_url}" class="absolute inset-0 w-full h-full object-contain"/>`:iniciales(cl.nombre)}${eq.color_dot?`<span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-white" style="background:${eq.color_dot}"></span>`:''}</span>`;
}
const nomEq=eq=>eq.nombre||(CLUBES[eq.club_id]||{}).nombre||'—';
/* Modal (detalle del partido) */
function abrirModal(html){$('modal-body').innerHTML=html;const m=$('modal');m.classList.remove('hidden');m.classList.add('flex');}
function cerrarModal(){const m=$('modal');m.classList.add('hidden');m.classList.remove('flex');}

/* ---- Registro público de torneos (lead → backoffice del super-admin) ---- */
function modalRegistroTorneo(){
  abrirModal(`<div class="flex items-center justify-between mb-1"><h3 class="font-display text-2xl tracking-wide">➕ REGISTRA TU TORNEO</h3><button onclick="cerrarModal()" class="text-ink-400 text-xl">✕</button></div>
    <p class="text-xs text-ink-500 mb-4">Déjanos los datos básicos y te contactamos para dar de alta tu torneo en Liguify.</p>
    <label class="block text-sm mb-3"><span class="text-ink-400 font-semibold text-xs">Nombre del torneo *</span>
      <input id="rt-n" maxlength="80" placeholder="Ej. ARRIAGOL CUP" class="w-full border-b-2 border-line py-1.5 font-semibold outline-none focus:border-brand-500"/></label>
    <div class="grid sm:grid-cols-2 gap-3 mb-3">
      <label class="block text-sm"><span class="text-ink-400 font-semibold text-xs">Nombre de contacto *</span>
        <input id="rt-c" maxlength="80" placeholder="Tu nombre" class="w-full border-b-2 border-line py-1.5 font-semibold outline-none focus:border-brand-500"/></label>
      <label class="block text-sm"><span class="text-ink-400 font-semibold text-xs">Teléfono / WhatsApp *</span>
        <input id="rt-t" maxlength="25" placeholder="999 888 777" class="w-full border-b-2 border-line py-1.5 font-semibold outline-none focus:border-brand-500"/></label>
    </div>
    <label class="block text-sm mb-1"><span class="text-ink-400 font-semibold text-xs">Email *</span>
      <input id="rt-e" type="email" maxlength="120" placeholder="tucorreo@gmail.com" class="w-full border-b-2 border-line py-1.5 font-semibold outline-none focus:border-brand-500"/></label>
    <p class="text-[11px] text-ink-400 mb-4">💡 Usa el email con el que entrarás al sistema (tu cuenta de Google u otro correo): con ese mismo te daremos el acceso de administrador.</p>
    <p id="rt-err" class="hidden text-xs font-bold text-brand-600 mb-2"></p>
    <button id="rt-btn" onclick="enviarRegistroTorneo()" class="w-full bg-brand-500 text-white font-bold py-2.5 rounded-xl hover:bg-brand-600">📨 ENVIAR SOLICITUD</button>`);
}
async function enviarRegistroTorneo(){
  const v=id=>($(id)?$(id).value.trim():'');
  const n=v('rt-n'), c=v('rt-c'), t=v('rt-t'), e=v('rt-e');
  const errEl=$('rt-err');
  const fail=m=>{errEl.textContent='⚠ '+m; errEl.classList.remove('hidden');};
  if(n.length<2) return fail('Escribe el nombre del torneo.');
  if(c.length<2) return fail('Escribe el nombre de contacto.');
  if(t.length<6) return fail('Escribe un teléfono válido.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return fail('Escribe un email válido.');
  $('rt-btn').disabled=true; $('rt-btn').textContent='Enviando…';
  const {error}=await sb.from('solicitud_torneo').insert({nombre_torneo:n, contacto:c, telefono:t, email:e});
  if(error){$('rt-btn').disabled=false;$('rt-btn').textContent='📨 ENVIAR SOLICITUD';return fail(error.message);}
  $('modal-body').innerHTML=`<div class="text-center py-8">
    <p class="text-5xl mb-3">✅</p>
    <h3 class="font-display text-3xl tracking-wide mb-2">¡SOLICITUD ENVIADA!</h3>
    <p class="text-sm text-ink-500 mb-1">Registramos <b>${n.replace(/</g,'&lt;')}</b>.</p>
    <p class="text-xs text-ink-400 mb-5">Te contactaremos a ${t.replace(/</g,'&lt;')} · ${e.replace(/</g,'&lt;')} para darlo de alta.</p>
    <button onclick="cerrarModal()" class="bg-ink-900 text-white font-bold px-6 py-2.5 rounded-xl hover:bg-ink-700">ENTENDIDO</button>
  </div>`;
}
async function abrirDetallePartido(id){
  const m=PART_IDX[id]; if(!m) return;
  const L=EQUIPOS[m.local_id], V=EQUIPOS[m.visita_id];
  const fin=['finalizado','walkover'].includes(m.estado), vivo=m.estado==='en_vivo';
  const {data:pl}=await sb.from('vista_planilla_publica').select('*').eq('partido_id',id);
  const stats=(pl||[]).filter(p=>p.jugo||p.goles||p.amarillas||p.rojas).sort((a,b)=>(a.dorsal??99)-(b.dorsal??99));
  const filaJ=p=>`<div class="flex items-center gap-2 py-1.5 border-b border-line last:border-0">
    <span class="w-5 text-ink-400 font-bold text-xs text-right shrink-0">${p.dorsal??''}</span>
    <span class="flex-1 min-w-0 text-sm font-semibold truncate">${p.nombres} ${p.apellidos}${p.capitan?' <span class="text-[9px] bg-ink-900 text-white rounded px-1 py-0.5 font-bold">C</span>':''}</span>
    <span class="text-sm shrink-0">${p.goles>3?'⚽×'+p.goles:'⚽'.repeat(p.goles||0)}${'🟨'.repeat(p.amarillas||0)}${'🟥'.repeat(p.rojas||0)}</span>
  </div>`;
  const col=(eqId,nom)=>{const list=stats.filter(p=>p.equipo_id===eqId);
    return `<div class="min-w-0"><p class="font-display text-lg tracking-wide border-b-2 border-ink-900 pb-1 truncate">${nom}</p>
      ${list.length?list.map(filaJ).join(''):'<p class="text-xs text-ink-400 py-3 text-center">Sin detalle registrado.</p>'}</div>`;};
  let figHTML='';
  if(m.figura_inscripcion_id){
    let f=(pl||[]).find(p=>p.inscripcion_id===m.figura_inscripcion_id);
    if(!f){const q=await sb.from('vista_lbf_publica').select('*').eq('inscripcion_id',m.figura_inscripcion_id).limit(1); f=(q.data||[])[0];}
    if(f){
      window.__FIG={m,f};
      figHTML=`<div class="mt-4 bg-ink-900 text-white rounded-2xl p-4 flex items-center gap-4 flex-wrap">
      <span class="w-20 h-20 rounded-full grid place-items-center font-bold overflow-hidden relative shrink-0 ring-4 ring-amber-400/60" style="background:#2b3550;${f.consentimiento_imagen?'':'filter:grayscale(1)'}">${f.foto_url?`<img src="${f.foto_url}" class="absolute inset-0 w-full h-full object-cover"/>`:iniciales((f.nombres||'')+' '+(f.apellidos||''))}</span>
      <div class="min-w-0 flex-1"><p class="text-[10px] font-bold tracking-widest text-amber-400 uppercase">⭐ Figura del partido</p>
        <p class="font-display text-2xl tracking-wide truncate">${f.nombres} ${f.apellidos}</p>
        <p class="text-white/50 text-xs">${EQUIPOS[f.equipo_id]?nomEq(EQUIPOS[f.equipo_id]):''}</p></div>
      <button onclick="compartirFigura()" class="bg-amber-400 text-ink-900 text-xs font-bold px-4 py-2.5 rounded-xl hover:bg-amber-300 shrink-0">📤 COMPARTIR</button>
    </div>`;
    }
  }
  const ctx=m.etapa?`🏆 ${m.etapa}`:(m.jornada&&m.jornada.numero?`Fecha ${m.jornada.numero}`:'');
  abrirModal(`<div class="flex items-center justify-between mb-3"><h3 class="font-display text-2xl tracking-wide">DETALLE DEL PARTIDO</h3><button onclick="cerrarModal()" class="text-ink-400 text-xl">✕</button></div>
    <div class="flex items-center justify-center gap-4 mb-1">
      <div class="text-center flex-1 min-w-0">${L?badge(L,9):''}<p class="text-xs font-bold mt-1 truncate">${L?nomEq(L):'Por definir'}</p></div>
      <div class="text-center shrink-0">
        ${vivo?'<p class="text-[10px] font-bold text-brand-600"><span class="live-dot"></span> EN VIVO</p>':`<p class="text-[10px] font-bold uppercase ${fin?'text-emerald-600':'text-ink-400'}">${m.estado}</p>`}
        <p class="font-display text-5xl tracking-wider">${m.goles_local??'–'} : ${m.goles_visita??'–'}</p>
        ${m.penales?`<p class="text-[10px] text-ink-400">penales ${m.penales_local} x ${m.penales_visita}</p>`:''}
      </div>
      <div class="text-center flex-1 min-w-0">${V?badge(V,9):''}<p class="text-xs font-bold mt-1 truncate">${V?nomEq(V):'Por definir'}</p></div>
    </div>
    <p class="text-[10px] text-ink-400 text-center mb-4">${ctx}${m.fecha?' · '+m.fecha:''}${m.hora?' '+m.hora.slice(0,5):''}${m.sede?' · '+m.sede:''}</p>
    ${m.video_url?`<div class="text-center mb-4"><a href="${m.video_url}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 bg-brand-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl hover:bg-brand-600">📺 VER VIDEO DEL PARTIDO</a></div>`:''}
    <div class="grid sm:grid-cols-2 gap-x-6 gap-y-3">${col(m.local_id,L?nomEq(L):'')+col(m.visita_id,V?nomEq(V):'')}</div>
    ${figHTML}`);
}
/* Imagen cuadrada de la FIGURA DEL PARTIDO (1080×1080 para redes) */
function cargarImg(url){
  return new Promise(res=>{
    if(!url){res(null);return;}
    const im=new Image(); im.crossOrigin='anonymous';
    const t=setTimeout(()=>res(null),6000);
    im.onload=()=>{clearTimeout(t);res(im)};
    im.onerror=()=>{clearTimeout(t);res(null)};
    im.src=url;
  });
}
async function compartirFigura(){
  if(!window.__FIG) return;
  const {m,f}=window.__FIG;
  const L=EQUIPOS[m.local_id], V=EQUIPOS[m.visita_id];
  await Promise.all([document.fonts.load('90px "Bebas Neue"'),document.fonts.load('700 30px Inter'),document.fonts.load('600 26px Inter')]);
  const [foto,logo,escL,escV]=await Promise.all([
    cargarImg(f.foto_url),
    cargarImg(TORNEO.logo_url||MARCA.logo_url),
    cargarImg(L?(CLUBES[L.club_id]||{}).escudo_url:null),
    cargarImg(V?(CLUBES[V.club_id]||{}).escudo_url:null)
  ]);
  const W=1080, cv=document.createElement('canvas'); cv.width=W; cv.height=W;
  const x=cv.getContext('2d');
  const fitText=(t,font,max)=>{let s=parseInt(font.match(/(\d+)px/)[1]);
    for(;s>18;s--){x.font=font.replace(/\d+px/,s+'px'); if(x.measureText(t).width<=max) break;} return x.font;};
  const circulo=(img,cx,cy,r,color,ini,bn)=>{
    x.save(); x.beginPath(); x.arc(cx,cy,r,0,7); x.clip();
    if(img){ if(bn) x.filter='grayscale(1)'; x.drawImage(img,cx-r,cy-r,r*2,r*2); x.filter='none'; }
    else{ x.fillStyle=color; x.fillRect(cx-r,cy-r,r*2,r*2);
      x.fillStyle='#fff'; x.font=`700 ${Math.round(r*0.7)}px Inter`; x.textAlign='center'; x.textBaseline='middle'; x.fillText(ini,cx,cy+4); }
    x.restore(); x.textAlign='left'; x.textBaseline='alphabetic';
  };
  // fondo con textura sutil
  x.fillStyle='#171e2e'; x.fillRect(0,0,W,W);
  x.fillStyle='rgba(255,255,255,.03)'; x.font='560px "Bebas Neue"'; x.textAlign='center';
  x.fillText('⭐',W/2,W-120); x.textAlign='left';
  // cabecera
  circulo(logo,104,104,52,'#d9232e',iniciales(MARCA.nombre));
  x.fillStyle='#fff'; x.font=fitText(TORNEO.nombre.toUpperCase(),'62px "Bebas Neue"',760);
  x.fillText(TORNEO.nombre.toUpperCase(),186,112);
  x.fillStyle='rgba(255,255,255,.45)'; x.font='600 26px Inter';
  x.fillText((CAT.nombre_display||('Categoría '+CAT.anio_nacimiento+' / '+CAT.modalidad)),188,152);
  x.fillStyle='#d9232e'; x.fillRect(0,196,W,6);
  // foto central con anillo dorado
  const cy=470, r=220;
  x.beginPath(); x.arc(W/2,cy,r+12,0,7); x.strokeStyle='#ffd166'; x.lineWidth=10; x.stroke();

/* Llaves con plantilla (§13): etiqueta del cupo cuando el equipo aún no se define */
let PART_IDX={};
function etiquetaCupo(o){
  if(!o) return 'Por definir';
  if(o.t==='zona') return `${o.puesto}º ZONA ${o.zona}`;
  if(o.t==='mejor') return `${o.rank&&o.rank>1?o.rank+'º ':''}MEJOR ${o.puesto}º`;
  if(o.t==='ganador'||o.t==='perdedor'){
    const src=PART_IDX[o.partido];
    return (o.t==='ganador'?'GANADOR ':'PERDEDOR ')+(src?(src.etapa||''):'');
  }
  return 'Por definir';
}

   publica en los flyers y en el catálogo). Vercel sirve index.html para

async function abrirPorRuta(){
  const slug=decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,'')).toLowerCase();

/* Público: solo EN CURSO por defecto; los finalizados quedan tras el botón
   "torneos anteriores". Borradores y archivados NUNCA se muestran. */
let PUB_TORNEOS=[], PUB_VER_ANTERIORES=false;
function renderTorneosPub(){
  const filaT=t=>`
    <button onclick='irTorneoId("${t.id}")' class="w-full bg-white border border-line rounded-2xl px-5 py-4 flex items-center gap-4 hover:shadow-md transition text-left">
      <span class="w-11 h-11 rounded-xl grid place-items-center text-white font-display text-sm overflow-hidden relative" style="background:#171e2e">${t.logo_url?`<img src="${t.logo_url}" class="absolute inset-0 w-full h-full object-cover"/>`:(t.nombre.replace(MARCA.nombre,'').trim().slice(0,4)||iniciales(t.nombre))}</span>
      <span class="flex-1">
        <span class="font-bold block">${t.nombre}</span>
        <span class="text-xs text-ink-400">Temporada ${t.anio} · ${t.estado==='en_curso'?'<b class="text-emerald-600">EN CURSO</b>':t.estado}</span>
      </span><span class="text-ink-400">→</span>
    </button>`;
  const enCurso=PUB_TORNEOS.filter(t=>t.estado==='en_curso');
  let anteriores=PUB_TORNEOS.filter(t=>t.estado==='finalizado');
  let principales=enCurso;
  // sin torneos en curso → se muestra el último finalizado como principal
  if(!enCurso.length&&anteriores.length){
    principales=[anteriores[anteriores.length-1]];
    anteriores=anteriores.slice(0,-1);
  }
  $('torneos').innerHTML=
    (principales.map(filaT).join('')||'<p class="text-ink-400 text-sm bg-white border border-line rounded-2xl px-5 py-4">Sin torneos publicados por el momento.</p>')
    +(anteriores.length?`

        ${PUB_VER_ANTERIORES?'▾ OCULTAR':'▸ VER'} TORNEOS ANTERIORES (${anteriores.length})
      </button>
      ${PUB_VER_ANTERIORES?anteriores.map(filaT).join(''):''}`:'');
}

              <td class="text-center text-xs font-bold text-ink-500">${r._zona}</td>
              ${celdas(r)}
            </tr>`).join('')}</tbody></table></div>`;
      }).join('')+ultHTML+golHTML;

  }
  $('tab-tabla').innerHTML=toggle+zonas.map(z=>{
    const rows=data.filter(r=>r.zona===z).sort(cmp);
    return `<div class="bg-white rounded-2xl border border-line mb-4 overflow-x-auto">
      <div class="px-4 py-3 border-b border-line font-display text-xl tracking-wide">ZONA ${z}</div>
      <table class="w-full min-w-[480px]">

          <th class="py-2 w-8"></th><th class="text-left">Equipo</th>
          ${orden.map(k=>`<th class="w-10">${COLDEF[k].h}</th>`).join('')}
        </tr></thead>
        <tbody>${rows.map((r,i)=>`<tr class="border-b border-line last:border-0 hover:bg-paper">
          <td class="py-2.5 pl-2 text-ink-400 font-bold text-center">${i+1}</td>
          <td><button onclick='irEquipoId("${r.equipo_id}")' class="flex items-center gap-2.5 font-semibold text-sm hover:text-brand-600">${EQUIPOS[r.equipo_id]?badge(EQUIPOS[r.equipo_id]):''}<span>${r.equipo}</span></button></td>

/* Fixture: partidos agrupados por jornada, desde la BD */
async function renderFixture(){
  const {data,error}=await sb.from('partido')
    .select('*, jornada:jornada_id(numero,nombre,horarios_publicados), zona:zona_id(nombre)')
    .eq('categoria_id',CAT.id).order('fecha').order('hora');
  if(error){$('tab-fixture').innerHTML='';err(error.message);return;}
  await cargarPlanillas(data.filter(m=>['finalizado','walkover'].includes(m.estado)).map(m=>m.id));   // goles y tarjetas bajo el marcador
  const grupos={};
  data.forEach(m=>{ PART_IDX[m.id]=m;
    if(m.jornada&&m.jornada.horarios_publicados===false) return;   // fecha OCULTA: no se muestra en el público
    const k=m.etapa||('FECHA '+((m.jornada&&m.jornada.numero)||'?')); (grupos[k]=grupos[k]||[]).push(m); });
  $('tab-fixture').innerHTML=Object.entries(grupos).map(([g,ms])=>`
    <div class="bg-white rounded-2xl border border-line mb-4">
      <div class="px-4 py-2.5 border-b border-line font-display text-lg tracking-wide">${g.toUpperCase()}</div>
      ${ms.map(filaPartidoPublico).join('')}
    </div>`).join('') || '<p class="text-ink-400 text-sm">Sin partidos programados.</p>';
}
/* Fila de partido (la usan el Fixture y los Últimos resultados de la Tabla) */
/* Goles y tarjetas por partido (planilla pública) para mostrarlos bajo el marcador
   sin entrar al detalle: ⚽ Nombre Apellido ×2 · 🟨 · 🟥, alineados con su equipo */
let PLAN_IDX={};
async function cargarPlanillas(ids){
  ids=(ids||[]).filter(id=>id&&!(id in PLAN_IDX));
  if(!ids.length) return;
  const {data}=await sb.from('vista_planilla_publica').select('partido_id,equipo_id,nombres,apellidos,goles,amarillas,rojas')
    .in('partido_id',ids).or('goles.gt.0,amarillas.gt.0,rojas.gt.0');
  ids.forEach(id=>{PLAN_IDX[id]=[];});
  (data||[]).forEach(r=>{(PLAN_IDX[r.partido_id]=PLAN_IDX[r.partido_id]||[]).push(r);});
}
function eventosHTML(m){
  const rows=PLAN_IDX[m.id]; if(!rows||!rows.length) return '';
  const nom=r=>(((r.nombres||'').trim().split(/\s+/)[0]||'')+' '+((r.apellidos||'').trim().split(/\s+/)[0]||'')).trim();
  const lado=eqId=>rows.filter(r=>r.equipo_id===eqId).flatMap(r=>{const o=[];
    if(r.goles>0) o.push(`<span class="block whitespace-nowrap">⚽ ${nom(r)}${r.goles>1?' <b>×'+r.goles+'</b>':''}</span>`);
    if(r.amarillas>0) o.push(`<span class="block whitespace-nowrap">🟨 ${nom(r)}${r.amarillas>1?' ×'+r.amarillas:''}</span>`);
    if(r.rojas>0) o.push(`<span class="block whitespace-nowrap">🟥 ${nom(r)}</span>`);
    return o;}).join('');
  const L=lado(m.local_id), V=lado(m.visita_id);
  if(!L&&!V) return '';
  return `<div class="flex gap-1 sm:gap-2 mt-1 text-[10px] text-ink-500 font-semibold">
    <div class="flex-1 min-w-0 text-right">${L}</div><div class="w-24 sm:w-28 shrink-0"></div><div class="flex-1 min-w-0 text-left">${V}</div></div>`;
}
function filaPartidoPublico(m){
  const fin=m.estado==='finalizado'||m.estado==='walkover', vivo=m.estado==='en_vivo';
  const L=EQUIPOS[m.local_id], V=EQUIPOS[m.visita_id];
  const lado=(e,ori,der)=>e
    ?(der?`${badge(e)} ${nomEq(e)}`:`${nomEq(e)} ${badge(e)}`)
    :`<span class="italic text-ink-400">${etiquetaCupo(ori)}</span>`;
  const gL=fin&&(m.penales?(m.penales_local??0)>(m.penales_visita??0):m.goles_local>m.goles_visita);
  const gV=fin&&(m.penales?(m.penales_visita??0)>(m.penales_local??0):m.goles_visita>m.goles_local);
  return `<div onclick="abrirDetallePartido('${m.id}')" class="px-3 sm:px-4 py-3 border-b border-line last:border-0 cursor-pointer hover:bg-paper" title="Ver detalle del partido">
    <div class="flex items-center gap-1 sm:gap-2">
      <div class="flex-1 min-w-0 flex items-center justify-end gap-1.5 sm:gap-2 text-xs sm:text-sm ${gL?'font-bold':''}">${lado(L,m.local_origen,false)}</div>
      <div class="w-24 sm:w-28 text-center shrink-0">
        ${vivo?`<span class="flex items-center justify-center gap-1 text-[9px] font-bold text-brand-600"><span class="live-dot"></span>EN VIVO</span>`
          :`<span class="block text-[9px] font-bold uppercase ${fin?'text-emerald-600':'text-ink-400'}">${(!m.local_id||!m.visita_id)?'por definir':m.estado}</span>`}
        <span class="font-display text-2xl">${m.goles_local??'–'} : ${m.goles_visita??'–'}</span>
        ${m.penales?`<span class="block text-[11px] text-ink-400 -mt-0.5">penales ${m.penales_local} x ${m.penales_visita}</span>`:''}
      </div>
      <div class="flex-1 min-w-0 flex items-center gap-1.5 sm:gap-2 text-xs sm:text-sm ${gV?'font-bold':''}">${lado(V,m.visita_origen,true)}</div>
    </div>
    ${eventosHTML(m)}
    <p class="text-[11px] font-semibold text-ink-500 text-center mt-1.5">${(m.jornada&&m.jornada.horarios_publicados===false)?'🕒 Horario por confirmar':`📅 ${m.fecha||'Día por definir'}  ·  🕒 ${m.hora?m.hora.slice(0,5):'--:--'}${m.sede?'  ·  📍 '+m.sede:''}`}</p>
    ${m.video_url?videoPill(m.video_url):''}
  </div>`;
}
/* ÚLTIMOS RESULTADOS (pestaña Tabla): la última fecha jugada o en juego.
   Se elige la jornada visible de mayor número que tenga algún partido
   finalizado/walkover/en vivo, y se muestran TODOS sus partidos. */
async function ultimosResultadosHTML(){
  const {data}=await sb.from('partido')
    .select('*, jornada:jornada_id(numero,nombre,horarios_publicados)')
    .eq('categoria_id',CAT.id).not('jornada_id','is',null).order('fecha').order('hora');
  const vis=(data||[]).filter(m=>!(m.jornada&&m.jornada.horarios_publicados===false));
  const jugados=vis.filter(m=>['finalizado','walkover','en_vivo'].includes(m.estado));
  if(!jugados.length) return '';
  const num=Math.max(...jugados.map(m=>(m.jornada&&m.jornada.numero)||0));
  const ms=vis.filter(m=>((m.jornada&&m.jornada.numero)||0)===num);
  ms.forEach(m=>{PART_IDX[m.id]=m;});
  await cargarPlanillas(ms.filter(m=>['finalizado','walkover'].includes(m.estado)).map(m=>m.id));
  const enVivo=ms.some(m=>m.estado==='en_vivo');
  return `<div class="bg-white rounded-2xl border border-line mb-4">
    <div class="px-4 py-2.5 border-b border-line flex items-center justify-between flex-wrap gap-2">
      <span class="font-display text-lg tracking-wide">${enVivo?'🔴 SE ESTÁ JUGANDO':'⚽ ÚLTIMOS RESULTADOS'} · FECHA ${num}</span>
      <button onclick="renderTabs('fixture')" class="text-[11px] font-bold text-brand-600 hover:underline">Ver fixture completo →</button>
    </div>
    ${ms.map(filaPartidoPublico).join('')}
  </div>`;
}

/* Llaves: bracket de la fase eliminatoria (no suma puntos a grupos) */
const ORDEN_ETAPAS=['Octavos','Cuartos de final','Semifinal','Tercer puesto','Final'];
function cardLlave(m){
  const fin=['finalizado','walkover'].includes(m.estado), vivo=m.estado==='en_vivo';
  const marc=id=>(fin||vivo)?(id===m.local_id?m.goles_local:m.goles_visita):'–';
  const pen=id=>m.penales?`<span class="text-[10px] text-ink-400 ml-1">(${id===m.local_id?m.penales_local:m.penales_visita})</span>`:'';
  const gana=id=>fin&&(m.penales
    ?(id===m.local_id?m.penales_local>m.penales_visita:m.penales_visita>m.penales_local)
    :(id===m.local_id?m.goles_local>m.goles_visita:m.goles_visita>m.goles_local));
  return `<div onclick="abrirDetallePartido('${m.id}')" class="bg-white border border-line rounded-2xl p-4 hover:shadow-md transition cursor-pointer" title="Ver detalle del partido">
    <p class="text-[10px] font-bold uppercase tracking-wider ${vivo?'text-brand-600':'text-ink-400'} mb-2">
      ${vivo?'<span class="live-dot inline-block align-middle mr-1"></span>EN VIVO · ':''}🏆 ${m.etapa}
      ${m.fecha?` · ${m.fecha}`:''}${m.hora?` ${m.hora.slice(0,5)}`:''}
    </p>
    ${[[m.local_id,m.local_origen],[m.visita_id,m.visita_origen]].map(([id,ori])=>{const e=EQUIPOS[id];return `
      <div class="flex items-center gap-2 py-1.5 ${id&&gana(id)?'font-bold':''}">
        ${e?badge(e):'<span class="inline-block w-7 h-7 rounded-lg bg-paper border border-dashed border-line shrink-0"></span>'}
        <span class="text-sm flex-1 ${e?'':'italic text-ink-400'}">${e?nomEq(e):etiquetaCupo(ori)}</span>
        <span class="font-display text-xl">${id?(marc(id)??'–'):'–'}</span>${id?pen(id):''}
      </div>`;}).join('')}
    ${m.penales?'<p class="text-[10px] text-ink-400 mt-1">definición por penales</p>':''}
    ${m.sede?`<p class="text-[10px] text-ink-400 mt-1">📍 ${m.sede}</p>`:''}
  </div>`;
}
async function renderLlaves(){
  const {data,error}=await sb.from('partido').select('*, fase:fase_id(nombre)')
    .eq('categoria_id',CAT.id).not('etapa','is',null).order('etapa');
  if(error){$('tab-llaves').innerHTML='';return;}
  (data||[]).forEach(m=>PART_IDX[m.id]=m);   // para etiquetas "GANADOR Semifinal #1"
  if(!(data||[]).length){
    $('tab-llaves').innerHTML='<p class="text-ink-400 text-sm bg-white border border-line rounded-2xl p-6 text-center">La fase eliminatoria aún no está programada.</p>';
    return;
  }
  // SECCIONES por fase (ORO / PLATA / …) y dentro, columnas por etapa
  const porFase={};
  data.forEach(m=>{const f=(m.fase&&m.fase.nombre)||'Eliminatoria';(porFase[f]=porFase[f]||[]).push(m);});
  const medalla=n=>/oro/i.test(n)?'🥇':/plata/i.test(n)?'🥈':/bronce/i.test(n)?'🥉':'🏆';
  $('tab-llaves').innerHTML=`
    <p class="text-ink-500 text-sm mb-4">Fase eliminatoria — los resultados de las llaves no suman puntos a la tabla de grupos.</p>`+
    Object.entries(porFase).map(([faseNom,ms])=>{
      const grupos={};
      ms.forEach(m=>{const k=(m.etapa||'').split(' #')[0];(grupos[k]=grupos[k]||[]).push(m);});
      const etapas=Object.keys(grupos).sort((a,b)=>{
        const ia=ORDEN_ETAPAS.indexOf(a), ib=ORDEN_ETAPAS.indexOf(b);
        return (ia<0?99:ia)-(ib<0?99:ib);
      });
      return `<div class="mb-8">
        <div class="bg-ink-900 text-white rounded-2xl px-5 py-3 mb-4 flex items-center gap-2">
          <span class="text-xl">${medalla(faseNom)}</span>
          <span class="font-display text-2xl tracking-wide">${faseNom.toUpperCase()}</span>
        </div>
        <div class="grid gap-4 items-start" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
          ${etapas.map(et=>`<div>
            <p class="font-display text-xl tracking-wide mb-2 ${et==='Final'?'text-amber-600':''}">${et.toUpperCase()}</p>
            <div class="space-y-3">${grupos[et].map(cardLlave).join('')}</div>
          </div>`).join('')}
        </div>
      </div>`;
    }).join('');
}

  $('eq-lbf').innerHTML=data.length?data.map(j=>`
    <div class="flex items-center gap-3 px-5 py-2.5 border-b border-line last:border-0">
      <span class="w-9 h-9 rounded-full grid place-items-center text-[11px] font-bold text-white overflow-hidden relative" style="background:#2b3550;${j.consentimiento_imagen?'':'filter:grayscale(1);opacity:.75'}">
        ${j.foto_url?`<img src="${j.foto_url}" class="absolute inset-0 w-full h-full object-cover"/>`:iniciales(j.nombres+' '+j.apellidos)}
      </span>
      <span class="w-6 text-ink-400 font-bold text-sm">${j.dorsal??''}</span>
      <span class="flex-1 font-semibold text-sm">${j.nombres} ${j.apellidos} ${j.capitan?'<span class="text-[9px] bg-ink-900 text-white rounded px-1.5 py-0.5 ml-1 font-bold">C</span>':''}
        ${(j.posicion||j.pie_habil)?`<span class="block text-[10px] text-ink-400 font-normal">${[j.posicion,j.pie_habil].filter(Boolean).join(' · ')}</span>`:''}</span>
      <span class="text-xs text-ink-400">nac. ${j.mes_nacimiento?String(j.mes_nacimiento).padStart(2,'0')+'/':''}${j.anio_nacimiento}</span>
      ${j.perfil_token?`<a href="/jugador/${j.perfil_token}" target="_blank" rel="noopener" title="${j.perfil_activo?'Perfil activo (administrado por su familia)':'Perfil disponible — su familia aún no lo administra'}" class="shrink-0 inline-flex items-center gap-1 ${j.perfil_activo?'bg-amber-400 hover:bg-amber-500 text-ink-900':'bg-ink-400/20 hover:bg-ink-400/30 text-ink-500'} text-[10px] font-bold rounded-full px-2.5 py-1">⭐ PERFIL</a>`:''}
    </div>`).join(''):'<p class="px-5 py-8 text-sm text-ink-400 text-center">Este equipo aún no publica su plantel.</p>';
  show('s-equipo');
}

/* ============ REALTIME: la página se actualiza sola ============ */
sb.channel('publico-live')
  .on('postgres_changes',{event:'*',schema:'competencias',table:'partido'},async ()=>{
    $('hdr-rt').innerHTML='<span class="live-dot"></span> actualizado en vivo';
    setTimeout(()=>$('hdr-rt').innerHTML='',4000);
    if($('s-categoria').classList.contains('active')){ await renderTabla(); await renderFixture(); await renderLlaves(); }
  })
  .subscribe(st=>{ if(st==='SUBSCRIBED') $('hdr-rt').innerHTML=''; });

abrirPorRuta();
</script>
